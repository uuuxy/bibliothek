# golangci-lint v2 configuration (schema version 2).
# Hinweis: In v2 ist gosimple in staticcheck integriert; ein separater Eintrag
# entfällt. "disable-all: true" heißt jetzt "default: none".
version: "2"
linters:
  default: none
  enable:
    - errcheck      # Findet ignorierte Fehler (wie das fehlende Fehler-Handling bei tx.Rollback)
    - govet         # Findet Bugs und verdächtige Konstrukte (z.B. falsche Operator-Präzedenz)
    - ineffassign   # Findet Zuweisungen, die nie genutzt werden
    - rowserrcheck  # Erzwingt rows.Err()-Prüfung nach pgx-Query (institutionalisiert #1, verifiziert für pgx v5)
    - staticcheck   # Der Standard-Linter (inkl. der ehemaligen gosimple-Checks, z.B. SA4010)
    - revive
    - unused        # Findet ungenutzte Variablen, Konstanten und Funktionen
    - depguard      # Sperrt Prüfbibliotheken neben dem Paket testing (docs/STIL.md, Abschnitt 10)
    - forbidigo     # Sperrt reflect.DeepEqual in Tests und log.Print/Fatal/Panic im Server (docs/STIL.md, Abschnitte 10 und 11)
    - recvcheck     # Die Methoden eines Typs nehmen alle einen Zeiger oder alle einen Wert (Decisions, „Receiver type")
    - containedctx  # Kein Kontext als Feld eines Typs (Decisions, „Contexts")
    - contextcheck  # Wer einen Kontext hat, reicht ihn weiter, statt einen neuen anzulegen (Decisions, „Contexts")
    - ireturn       # Ein Erzeuger liefert den Typ, keine Schnittstelle (docs/STIL.md, Abschnitt 14)
    - errorlint     # Ein Fehler im Text eines Fehlers bleibt eingewickelt, %w statt %v (docs/STIL.md, Abschnitt 11)
    - sloglint      # Die Meldung einer Logzeile ist fest, Werte stehen in Feldern (docs/STIL.md, Abschnitt 11)
  settings:
    errorlint:
      # Nur fmt.Errorf: Mit %v reißt die Kette, und die Antwort erkennt einen Abbruch des Browsers
      # nicht mehr; er stünde als ERROR im Log und löste den Alarm aus.
      errorf: true
      errorf-multi: true
      asserts: false
      comparison: false
    sloglint:
      # Die Seite „Fehler im Log“ zählt je Meldung; erst feste Meldungen begrenzen die Zahl der Gruppen.
      static-msg: true
    ireturn:
      # Nur die Schnittstellen dieses Projekts: pgx.Rows, pgx.Tx und die Attrappen von pgxmock gibt
      # die Bibliothek vor.
      reject:
        - ^bibliothek/
    depguard:
      rules:
        # Ohne eigene Regel ließe depguard nur die Standardbibliothek zu; diese sperrt nur, was
        # sie nennt.
        pruefbibliotheken:
          deny:
            - pkg: github.com/stretchr/testify
              desc: "Tests prüfen mit dem Paket testing, Vergleiche mit == oder cmp (docs/STIL.md, Abschnitt 10)"
    forbidigo:
      # Mit Typen erkennt die Prüfung den Aufruf auch, wenn das Paket anders heißt.
      analyze-types: true
      forbid:
        - pattern: ^reflect\.DeepEqual$
          msg: "Tests vergleichen mit cmp.Equal oder cmp.Diff (docs/STIL.md, Abschnitt 10)"
        # Das Paket log kennt keine Stufe; über slog.SetDefault landete jeder Fehler als INFO.
        - pattern: ^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$
          msg: "Der Server schreibt mit slog und Stufe ins Log (docs/STIL.md, Abschnitt 11)"
        # Excel speichert CSV unter Windows in Windows-1252; ein eigener Leser übergeht die Umwandlung.
        - pattern: ^csv\.NewReader$
          msg: "Eine hochgeladene CSV geht durch csvutil.BaueLeser"
    recvcheck:
      # Die Gegenstücke zu den Marshal-Methoden, die recvcheck von sich aus ausnimmt: UnmarshalJSON
      # und Scan ändern den Wert und brauchen einen Zeiger; MarshalJSON und Value arbeiten auf dem
      # Wert, sonst übergingen json.Marshal und pgx sie an einem Feld, das kein Zeiger ist, und
      # schrieben die Zahl der Cent als Euro.
      exclusions:
        - "Cent.UnmarshalJSON"
        - "Cent.Scan"
    errcheck:
      check-type-assertions: true
      check-blank: true
    revive:
      rules:
        - name: exported
        # Jedes Paket trägt genau einen Kommentar, unmittelbar über der package-Zeile.
        - name: package-comments
        # Ein Typ nennt seinen Empfänger in jeder Methode gleich, nie this oder self.
        - name: receiver-naming
        # any statt interface{} (Decisions, „Use any").
        - name: use-any
        # Kein Name verdeckt eine eingebaute Funktion wie copy, max oder min.
        - name: redefines-builtin-id
        # Ein umbenannter Import ist klein und ohne Unterstrich (Decisions, „Import renaming").
        - name: import-alias-naming
        # Eine öffentliche Funktion liefert keinen klein geschriebenen Typ (docs/STIL.md, Abschnitt 6).
        - name: unexported-return
    rowserrcheck:
      # rowserrcheck kennt database/sql von Haus aus nicht pgx — hier explizit
      # den pgx-v5-Treiber registrieren, sonst prüft es unsere Query-Aufrufe nicht.
      packages:
        - github.com/jackc/pgx/v5
  # v1 "issues.exclude-dirs". Die frühere exclude-rules-Regel für node_modules
  # war davon bereits vollständig abgedeckt und entfällt ersatzlos.
  exclusions:
    paths:
      - frontend
      - node_modules
    rules:
      # Die Sperre von reflect.DeepEqual gilt nur in Tests: cmp ist für Tests gebaut und gehört
      # nicht in den Server.
      - path-except: _test\.go
        linters:
          - forbidigo
        text: cmp\.Equal
      # Die Sperre des Pakets log gilt nur im Server: Tests und die Kommandozeilen-Werkzeuge in
      # cmd/ und scripts/ schreiben für einen Menschen am Terminal.
      - path: (_test\.go$|^cmd/|^scripts/)
        linters:
          - forbidigo
        text: slog und Stufe
      # csvutil.BaueLeser gilt für hochgeladene Dateien. Tests und Werkzeuge lesen eigene Dateien,
      # und die Übernahme des Altbestands liest die Ausgabe von mdb-export.
      - path: (_test\.go$|^cmd/|^scripts/|^internal/littera/|^pkg/csvutil/)
        linters:
          - forbidigo
        text: csvutil\.BaueLeser
      # Tests rufen die Prüfhilfen, die sich ihren Kontext selbst anlegen; die Regel gilt dem
      # Programmcode (kontext_ratsche_test.go).
      - path: _test\.go
        linters:
          - contextcheck
