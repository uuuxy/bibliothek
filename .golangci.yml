# golangci-lint v2 configuration (schema version 2).
# Hinweis: In v2 ist gosimple in staticcheck integriert; ein separater Eintrag
# entfällt. "disable-all: true" heißt jetzt "default: none".
version: "2"
linters:
  default: none
  enable:
    - errcheck      # Findet ignorierte Fehler (wie das fehlende Fehler-Handling bei tx.Rollback)
    - govet         # Findet Bugs und verdächtige Konstrukte (z.B. falsche Operator-Präzedenz)
    - ineffassign   # Findet Zuweisungen, die nie genutzt werden
    - rowserrcheck  # Erzwingt rows.Err()-Prüfung nach pgx-Query (institutionalisiert #1, verifiziert für pgx v5)
    - staticcheck   # Der Standard-Linter (inkl. der ehemaligen gosimple-Checks, z.B. SA4010)
    - revive
    - unused        # Findet ungenutzte Variablen, Konstanten und Funktionen
    - depguard      # Sperrt Prüfbibliotheken neben dem Paket testing (docs/STIL.md, Abschnitt 10)
    - forbidigo     # Sperrt reflect.DeepEqual in Tests (docs/STIL.md, Abschnitt 10)
    - recvcheck     # Die Methoden eines Typs nehmen alle einen Zeiger oder alle einen Wert (Decisions, „Receiver type")
    - containedctx  # Kein Kontext als Feld eines Typs (Decisions, „Contexts")
    - contextcheck  # Wer einen Kontext hat, reicht ihn weiter, statt einen neuen anzulegen (Decisions, „Contexts")
    - ireturn       # Ein Erzeuger liefert den Typ, keine Schnittstelle (docs/STIL.md, Abschnitt 14)
  settings:
    ireturn:
      # Nur die Schnittstellen dieses Projekts: pgx.Rows, pgx.Tx und die Attrappen von pgxmock gibt
      # die Bibliothek vor.
      reject:
        - ^bibliothek/
    depguard:
      rules:
        # Ohne eigene Regel ließe depguard nur die Standardbibliothek zu; diese sperrt nur, was
        # sie nennt.
        pruefbibliotheken:
          deny:
            - pkg: github.com/stretchr/testify
              desc: "Tests prüfen mit dem Paket testing, Vergleiche mit == oder cmp (docs/STIL.md, Abschnitt 10)"
    forbidigo:
      # Mit Typen erkennt die Prüfung den Aufruf auch, wenn das Paket anders heißt.
      analyze-types: true
      forbid:
        - pattern: ^reflect\.DeepEqual$
          msg: "Tests vergleichen mit cmp.Equal oder cmp.Diff (docs/STIL.md, Abschnitt 10)"
    errcheck:
      check-type-assertions: true
      check-blank: true
    revive:
      rules:
        - name: exported
        # Jedes Paket trägt genau einen Kommentar, unmittelbar über der package-Zeile.
        - name: package-comments
        # Ein Typ nennt seinen Empfänger in jeder Methode gleich, nie this oder self.
        - name: receiver-naming
        # any statt interface{} (Decisions, „Use any").
        - name: use-any
        # Kein Name verdeckt eine eingebaute Funktion wie copy, max oder min.
        - name: redefines-builtin-id
        # Ein umbenannter Import ist klein und ohne Unterstrich (Decisions, „Import renaming").
        - name: import-alias-naming
        # Eine öffentliche Funktion liefert keinen klein geschriebenen Typ (docs/STIL.md, Abschnitt 6).
        - name: unexported-return
    rowserrcheck:
      # rowserrcheck kennt database/sql von Haus aus nicht pgx — hier explizit
      # den pgx-v5-Treiber registrieren, sonst prüft es unsere Query-Aufrufe nicht.
      packages:
        - github.com/jackc/pgx/v5
  # v1 "issues.exclude-dirs". Die frühere exclude-rules-Regel für node_modules
  # war davon bereits vollständig abgedeckt und entfällt ersatzlos.
  exclusions:
    paths:
      - frontend
      - node_modules
    rules:
      # forbidigo gilt nur in Tests: cmp ist für Tests gebaut und gehört nicht in den Server.
      - path-except: _test\.go
        linters:
          - forbidigo
      # Tests rufen die Prüfhilfen, die sich ihren Kontext selbst anlegen; die Regel gilt dem
      # Programmcode (kontext_ratsche_test.go).
      - path: _test\.go
        linters:
          - contextcheck
      # Erzeuger, die noch eine Schnittstelle liefern (docs/STIL.md, Abschnitt 14). Die Liste wird
      # nur kürzer: Wer einen Erzeuger auf den Typ umstellt, streicht seine Zeile.
      - { linters: [ireturn], text: ^NewAusleihAbfragen returns }
      - { linters: [ireturn], text: ^NewBescheidAbfragen returns }
      - { linters: [ireturn], text: ^NewBestelldetailAbfragen returns }
      - { linters: [ireturn], text: ^NewEinstellungsAbfragen returns }
      - { linters: [ireturn], text: ^NewGeraeteAbfragen returns }
      - { linters: [ireturn], text: ^NewKatalogAbfragen returns }
      - { linters: [ireturn], text: ^NewKontoAbfragen returns }
      - { linters: [ireturn], text: ^NewLeserAbfragen returns }
      - { linters: [ireturn], text: ^NewLieferantenAbfragen returns }
      - { linters: [ireturn], text: ^NewProtokollAbfragen returns }
      - { linters: [ireturn], text: ^NewSchadensAbfragen returns }
      - { linters: [ireturn], text: ^NewVormerkungsAbfragen returns }
      - { linters: [ireturn], text: ^NewAusleihDienst returns }
      - { linters: [ireturn], text: ^NewGeraeteDienst returns }
      - { linters: [ireturn], text: ^NewNachbuchDienst returns }
      - { linters: [ireturn], text: ^NewOmniboxDienst returns }
