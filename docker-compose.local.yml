services:
  postgres-db:
    image: postgres:16-alpine
    container_name: bibliothek-db-local
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bibliothek
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bibliothek"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bibliothek-backend-local
    ports:
      - "8084:8084" # Lokaler Zugriff unter http://localhost:8084
    environment:
      - PORT=8084
      - DB_HOST=postgres-db
      - APP_ENV=local
      - DATABASE_URL=postgres://postgres:postgres@postgres-db:5432/bibliothek?sslmode=disable
      - JWT_SECRET=local-dev-jwt-secret-min-32-characters
      - APP_ENCRYPTION_KEY=super-secure-aes-key-32-chars-ok
      - COOKIE_SECURE=false
      - INITIAL_ADMIN_EMAIL=pflasch@philipp-reis-schule.de
      - IMAP_HOST=mock
      - SMTP_PORT=587
    volumes:
      - bibliothek_uploads_local:/app/uploads
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - default
      - caddy_global_net

volumes:
  postgres_data_local:
  bibliothek_uploads_local:

networks:
  default: {}
  caddy_global_net:
    external: true
