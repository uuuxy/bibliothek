services:
  postgres-db:
    image: postgres:16-alpine
    container_name: bibliothek-db-local
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt - bitte .env aus .env.example anlegen (cp .env.example .env)}
      - POSTGRES_DB=${POSTGRES_DB:-bibliothek}
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      # Nur localhost — identisch zum Prod-Stack, damit die Entwicklungsumgebung
      # nicht laxer ist als das, was sie abbildet. Reicht für psql/pgAdmin auf
      # diesem Rechner; von außen bewusst nicht erreichbar.
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bibliothek}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Wandert als ENV ins Image. update.sh vergleicht den Wert nach dem Deploy mit
        # `git rev-parse HEAD` und beantwortet damit die Frage, die kein Healthcheck
        # beantwortet: Laeuft der Container, der aus DIESEM Commit gebaut wurde?
        # Fehlt die Variable, bleibt der Wert leer — ein Build von Hand geht weiterhin.
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: bibliothek-backend-local
    ports:
      # Nur an localhost — aus demselben Grund wie beim Datenbank-Port oben, hier aber
      # dringender: Dieser Stack läuft mit IMAP_HOST=mock, und mock lässt JEDES Passwort
      # für JEDE in benutzer vorhandene E-Mail durch (auth/imap.go). Mit "8084:8084" war
      # dieser Login im gesamten Schul-/Heimnetz erreichbar — auf einem Arbeitsplatz, an
      # dem parallel echte Daten liegen, ist das eine offene Tür.
      # Caddy erreicht den Container weiterhin über das Docker-Netz
      # (caddy_global_net), nicht über diesen veröffentlichten Port.
      - "127.0.0.1:8084:8084" # Lokaler Zugriff unter http://localhost:8084
    environment:
      - PORT=8084
      - DB_HOST=postgres-db
      # Lokaler Entwicklungsmodus (APP_ENV=local): COOKIE_SECURE=false, Guard aus.
      # Das DB-Passwort kommt aus der .env (POSTGRES_PASSWORD) — kein committetes
      # Default-Secret mehr; siehe .env.example (cp .env.example .env).
      # Nur im lokalen Stack: Die E2E-Suite feuert neunundneunzig Flows ohne Pause von
      # EINER IP; der Produktionswert 50 Anfragen/s ist dafuer zu eng und liess je Lauf
      # zufaellig einen Test in den Timeout laufen (429, vom Frontend still geschluckt —
      # siehe orderStore.loadKonfiguration). Die Produktion behaelt ihre 50.
      - RATE_LIMIT=${RATE_LIMIT:-500}
      - APP_ENV=local
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt - bitte .env aus .env.example anlegen (cp .env.example .env)}@postgres-db:5432/${POSTGRES_DB:-bibliothek}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-local-dev-jwt-secret-min-32-characters}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-super-secure-aes-key-32-chars-ok}
      - COOKIE_SECURE=false
      - INITIAL_ADMIN_EMAIL=pflasch@philipp-reis-schule.de
      - IMAP_HOST=mock
      # E2E: e2e/selbstanmeldung.spec.js meldet ein @test.local-Postfach ohne Konto an.
      - SELBSTANMELDUNG_DOMAIN=test.local
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_PASS=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_SENDER=${SMTP_FROM}
      # Diese Zeilen sind Pflicht, nicht Kür: Compose reicht ohne env_file AUSSCHLIESSLICH
      # die hier gelisteten Schlüssel in den Container. Sie fehlten — der Backup-Job fand
      # deshalb im Container nie einen Schlüssel und übersprang sich STILL, obwohl
      # BACKUP_ENCRYPTION_KEY in der .env stand. Im Prod-Compose war genau das schon
      # einmal derselbe Fehler.
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
      - BACKUP_DIR=${BACKUP_DIR:-/app/backups}
      # Offsite-Ziel (optional): Ohne diese Zeilen kam S3_* aus der .env NIE im Container
      # an — die Selbstprüfung riet „S3_* in der .env setzen", und das blieb wirkungslos
      # (Prüfung 22.08.2026; gleiche Klasse wie BACKUP_ENCRYPTION_KEY oben). Leer = aus.
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_USE_SSL=${S3_USE_SSL:-true}
    volumes:
      - bibliothek_uploads_local:/app/uploads
      - bibliothek_backups_local:/app/backups
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - default
      - caddy_global_net

volumes:
  postgres_data_local:
  bibliothek_uploads_local:
  # Benanntes Volume, damit die verschlüsselten Dumps einen Container-Neubau überleben.
  bibliothek_backups_local:

networks:
  default: {}
  caddy_global_net:
    external: true
