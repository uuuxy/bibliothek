name: bibliothek-demo
services:
  postgres-db:
    image: postgres:18-alpine
    container_name: bibliothek-db-demo
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=demo
      - POSTGRES_DB=bibliothek
    volumes:
      # 18er-Image: Volume-Pfad ist /var/lib/postgresql, nicht mehr …/data.
      - demo_pg:/var/lib/postgresql
      - ../../schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bibliothek"]
      interval: 3s
      timeout: 5s
      retries: 10
  backend:
    image: bibliothek-demo:latest
    container_name: bibliothek-backend-demo
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      - PORT=8085
      - DB_HOST=postgres-db
      - RATE_LIMIT=500
      - APP_ENV=local
      - DATABASE_URL=postgres://postgres:demo@postgres-db:5432/bibliothek?sslmode=disable
      - JWT_SECRET=demo-only-jwt-secret-min-32-characters-xx
      - APP_ENCRYPTION_KEY=demo-only-aes-key-32-chars-okay!
      - COOKIE_SECURE=false
      - INITIAL_ADMIN_EMAIL=bibliothek@musterschule.de
      - IMAP_HOST=mock
      # Mail bewusst ins Leere: nichts verlässt den Demo-Stack.
      - SMTP_HOST=127.0.0.1
      - SMTP_PORT=9
      - SMTP_USER=demo
      - SMTP_PASSWORD=demo
      - SMTP_PASS=demo
      - SMTP_FROM=bibliothek@musterschule.de
      - SMTP_SENDER=bibliothek@musterschule.de
      - BACKUP_ENCRYPTION_KEY=demo-only-backup-key-32-characters!!
      - BACKUP_DIR=/app/backups
    volumes:
      - demo_uploads:/app/uploads
      - demo_backups:/app/backups
    depends_on:
      postgres-db:
        condition: service_healthy
volumes:
  demo_pg:
  demo_uploads:
  demo_backups:
