# SonarQube-Projektkonfiguration.
#
# Zweck dieser Datei: Regel-Entscheidungen versionskontrolliert und reviewbar im Repo
# festhalten, statt sie als server-seitige „Won't Fix"-Klicks zu vergraben (die bei einem
# frischen Server/Re-Scan verloren gehen). sonar-scanner liest diese Datei automatisch.
sonar.projectKey=bibliothek

# ── Was überhaupt analysiert wird ────────────────────────────────────────────────────────
# Ohne diese Zeilen indexiert der Scanner ALLES unterhalb des Projektwurzelverzeichnisses.
# Gemessen am 04.08.2026: frontend/node_modules allein sind 28.611 Dateien / 316 MB, dazu
# 21 MB Bilder in uploads/ — gegenüber rund 650 Dateien echtem Quellcode. Der Lauf vom
# selben Tag brach nach 8:18 Minuten mit EXECUTION FAILURE ab.
#
# node_modules enthält nebenbei sogar eine fremde Go-Datei (flatted/golang/…), die der
# Scanner als Projektcode gewertet hätte.
sonar.exclusions=\
  frontend/node_modules/**,\
  frontend/dist/**,\
  frontend/.svelte-kit/**,\
  uploads/**,\
  certs/**,\
  **/*.min.js,\
  **/*.min.css

# docs/docs.go ist generierte Swagger-Ausgabe (1.700+ Zeilen) und wird nicht von Hand
# gepflegt — Befunde darin sind nicht behebbar, ohne den Generator zu ändern.
#
# Testdateien zählen nicht als deckungspflichtiger Code. Go instrumentiert sie nicht (der
# Coverage-Report enthält sie gar nicht), SonarQube hält sie aber ohne diese Zeile für
# ungedeckten Code und rechnet sie gegen die Abdeckung. Konkret am 04.08.2026:
# metadaten_isbn_test.go war mit 7 „ungedeckten" Zeilen der größte Einzelposten der
# Messung — ein TEST, der die Abdeckungsquote senkt, weil er existiert.
sonar.coverage.exclusions=docs/docs.go,**/*_test.go

# ── Coverage ─────────────────────────────────────────────────────────────────────────────
# Ohne diese Zeile lädt der Scanner KEINE Abdeckung hoch, und SonarQube wertet fehlende
# Daten als 0 % — nicht als „unbekannt". Das Quality Gate (80 % auf neuem Code) stand
# deshalb am 04.08.2026 auf ERROR, obwohl 26 Testpakete grün sind.
# Erzeugt wird die Datei von scripts/sonar_scan.sh; ein blanker sonar-scanner-Aufruf
# findet sie nicht vor und kippt das Gate wieder.
sonar.go.coverage.reportPaths=coverage.out

# ── Duplikate ────────────────────────────────────────────────────────────────────────────
# Testdateien zählen nicht in die Duplikatsmessung — aus demselben Grund wie die
# S3776-Ausnahme unten: Table-driven Tests bestehen aus einer bewusst immer gleichen Hülle
# (`for _, f := range faelle { t.Run(f.name, …) }`). Zwei solche Tests im selben Paket
# sehen für die Copy-Paste-Erkennung fast identisch aus. Sie zu „entdoppeln" hieße, einen
# gemeinsamen Runner darüberzulegen — Testcode wird davon schwerer lesbar, nicht besser.
#
# EHRLICH DAZU: Diese Ausnahme deckt auch echte Duplikate zu, die bestehen bleiben —
# `pgtest_support_test.go` liegt in FÜNF Paketen (api, cmd/migrate, db, internal/littera,
# repository) mit gemeinsamem Kern (pgTestPool, baueTestDB, pruefeTestDatenbank) und je
# eigenen Seed-Helfern. Das ist kopierter Code, kein Tabellenmuster. Der saubere Weg wäre
# ein gemeinsames Paket (z. B. internal/pgtest), weil Helfer aus *_test.go paketübergreifend
# nicht importierbar sind. Bewusst NICHT vor Go-Live gemacht: Es fasst die Test-Infrastruktur
# von fünf Paketen auf einmal an und ist nur gegen ein echtes PostgreSQL beweisbar.
sonar.cpd.exclusions=docs/docs.go,**/*_test.go

# ── Regel-Ausschlüsse ────────────────────────────────────────────────────────────────────
# go:S3776 (Cognitive Complexity) wird auf TESTDATEIEN nicht erzwungen. Table-driven Tests
# mit langem, sequenziellem Setup/Assert reißen die Schwelle systematisch, ohne dass ein
# Aufsplitten die Wartbarkeit verbessert — es zerreißt eher den zusammenhängenden Testfluss.
# Für PRODUKTIONSCODE bleibt die Regel voll aktiv; dort wurde jede Funktion auf <15 gebracht.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go

# javascript:S2245 (unsicherer Zufallsgenerator) wird in den k6-Lastskripten nicht
# erzwungen. Math.random() waehlt dort einen zufaelligen Schueler aus der Testmenge und
# eine zufaellige Bestellmenge — es erzeugt Last, keine Schluessel, Token oder
# Sitzungs-IDs. Die Skripte laufen ausserdem nur von Hand gegen eine Testinstanz und
# sind in keinem Produktionspfad eingebunden (geprueft am 04.08.2026).
# Fuer ANWENDUNGSCODE bleibt die Regel voll aktiv; dort waere jeder Treffer ernst.
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S2245
sonar.issue.ignore.multicriteria.e2.resourceKey=loadtest*.js
