# SonarQube-Projektkonfiguration.
#
# Zweck dieser Datei: Regel-Entscheidungen versionskontrolliert und reviewbar im Repo
# festhalten, statt sie als server-seitige „Won't Fix"-Klicks zu vergraben (die bei einem
# frischen Server/Re-Scan verloren gehen). sonar-scanner liest diese Datei automatisch.
#
# Ein Schlüssel für alle Läufe: Das Quality Gate prüft den Code seit der letzten Version gegen
# den Stand desselben Projekts. Ein neu angelegtes Projekt hat keinen Vergleichsstand, und das
# Gate meldet OK, ohne etwas geprüft zu haben.
sonar.projectKey=Bibliothek5

# ── Was überhaupt analysiert wird ────────────────────────────────────────────────────────
# Ohne diese Zeilen indexiert der Scanner ALLES unterhalb des Projektwurzelverzeichnisses.
# Gemessen am 04.08.2026: frontend/node_modules allein sind 28.611 Dateien / 316 MB, dazu
# 21 MB Bilder in uploads/ — gegenüber rund 650 Dateien echtem Quellcode. Der Lauf vom
# selben Tag brach nach 8:18 Minuten mit EXECUTION FAILURE ab.
#
# node_modules enthält nebenbei sogar eine fremde Go-Datei (flatted/golang/…), die der
# Scanner als Projektcode gewertet hätte.
sonar.exclusions=\
  frontend/node_modules/**,\
  frontend/dist/**,\
  frontend/.svelte-kit/**,\
  uploads/**,\
  certs/**,\
  **/*.min.js,\
  **/*.min.css

# docs/docs.go ist generierte Swagger-Ausgabe (1.700+ Zeilen) und wird nicht von Hand
# gepflegt — Befunde darin sind nicht behebbar, ohne den Generator zu ändern.
#
# Testdateien zählen nicht als deckungspflichtiger Code. Go instrumentiert sie nicht (der
# Coverage-Report enthält sie gar nicht), SonarQube hält sie aber ohne diese Zeile für
# ungedeckten Code und rechnet sie gegen die Abdeckung. Konkret am 04.08.2026:
# metadaten_isbn_test.go war mit 7 „ungedeckten" Zeilen der größte Einzelposten der
# Messung — ein TEST, der die Abdeckungsquote senkt, weil er existiert.
sonar.coverage.exclusions=docs/docs.go,**/*_test.go,**/*.test.js,frontend/e2e/**

# ── Coverage ─────────────────────────────────────────────────────────────────────────────
# Ohne diese Zeile lädt der Scanner KEINE Abdeckung hoch, und SonarQube wertet fehlende
# Daten als 0 % — nicht als „unbekannt". Das Quality Gate (80 % auf neuem Code) stand
# deshalb am 04.08.2026 auf ERROR, obwohl 26 Testpakete grün sind.
# Erzeugt wird die Datei von scripts/sonar_scan.sh; ein blanker sonar-scanner-Aufruf
# findet sie nicht vor und kippt das Gate wieder.
sonar.go.coverage.reportPaths=coverage.out

# Frontend-Coverage (seit 23.08.2026). Bis dahin lud der Scan NUR die Go-Abdeckung hoch, und
# jede Frontend-Zeile zaehlte als ungedeckt — dieselbe Falle wie am 04.08. auf der Go-Seite:
# SonarQube wertet fehlende Coverage als 0 %, nicht als „unbekannt". Solange das Quality Gate
# mangels Vergleichsbasis nichts pruefte, fiel es nicht auf; mit der zweiten Analyse riss
# genau das die Bedingung new_coverage.
# Erzeugt wird der Bericht von scripts/sonar_scan.sh (npm run test:coverage) — gebunden an den
# Scan, aus demselben Grund wie die Go-Abdeckung.
#
# GRENZE, die man kennen muss: Der Bericht deckt die reinen .js-Dateien ab. Die 195
# .svelte-Komponenten (rund 26.000 Zeilen) stehen NICHT darin, weil SonarQube Svelte nicht
# parst und sie deshalb ohnehin nicht im Bericht auftauchen. Was dieser Server ueber das
# Frontend sagt, gilt fuer die .js-Schicht, nicht fuer die Komponenten.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ── Duplikate ────────────────────────────────────────────────────────────────────────────
# Testdateien zählen nicht in die Duplikatsmessung — aus demselben Grund wie die
# S3776-Ausnahme unten: Table-driven Tests bestehen aus einer bewusst immer gleichen Hülle
# (`for _, f := range faelle { t.Run(f.name, …) }`). Zwei solche Tests im selben Paket
# sehen für die Copy-Paste-Erkennung fast identisch aus. Sie zu „entdoppeln" hieße, einen
# gemeinsamen Runner darüberzulegen — Testcode wird davon schwerer lesbar, nicht besser.
#
# Der früher hier vermerkte Befund (pgtest_support_test.go fünffach kopiert) ist
# seit dem 31.08.2026 behoben: Der gemeinsame Kern liegt in internal/pgtest, die
# fünf Dateien tragen nur noch je eigene Seed-Helfer.
sonar.cpd.exclusions=docs/docs.go,**/*_test.go

# ── Regel-Ausschlüsse ────────────────────────────────────────────────────────────────────
# go:S3776 (Cognitive Complexity) wird auf TESTDATEIEN nicht erzwungen. Table-driven Tests
# mit langem, sequenziellem Setup/Assert reißen die Schwelle systematisch, ohne dass ein
# Aufsplitten die Wartbarkeit verbessert — es zerreißt eher den zusammenhängenden Testfluss.
# Für Produktionscode bleibt die Regel aktiv; dort lässt komplexitaet_ratsche_test.go keine
# Funktion über 15 zu und nimmt Testdateien ebenso aus.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go

# javascript:S2245 (unsicherer Zufallsgenerator) wird in den k6-Lastskripten nicht
# erzwungen. Math.random() waehlt dort einen zufaelligen Schueler aus der Testmenge und
# eine zufaellige Bestellmenge — es erzeugt Last, keine Schluessel, Token oder
# Sitzungs-IDs. Die Skripte laufen ausserdem nur von Hand gegen eine Testinstanz und
# sind in keinem Produktionspfad eingebunden (geprueft am 04.08.2026).
# Fuer ANWENDUNGSCODE bleibt die Regel voll aktiv; dort waere jeder Treffer ernst.
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S2245
sonar.issue.ignore.multicriteria.e2.resourceKey=loadtest*.js

# javascript:S2925 (feste Wartezeit statt Synchronisation) wird in den E2E-Tests des
# LiveSync-Wiederaufbaus nicht erzwungen. Die Regel hat im Normalfall recht: Wer auf eine
# Bedingung warten kann, soll nicht die Uhr befragen. Hier ist die Bedingung aber die
# ABWESENHEIT von Ereignissen — `livesync-wiederaufbau.spec.js` belegt, dass eine stehende
# Verbindung nicht laufend neu aufgebaut wird, und zählt dafür acht Sekunden lang die
# Verbindungsversuche. Auf "es passiert nichts mehr" lässt sich nicht synchronisieren;
# ohne die Wartezeit prüfte der Test gar nichts.
# Der positive Teil desselben Tests nutzt sehr wohl expect.poll (Zeile 44) — die Regel
# bleibt für alles andere aktiv, auch für die übrigen E2E-Dateien.
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S2925
sonar.issue.ignore.multicriteria.e3.resourceKey=**/livesync-wiederaufbau.spec.js

# secrets:S6698 (hartkodiertes PostgreSQL-Passwort) wird in scripts/pruefe_secrets.sh nicht
# erzwungen. Geprueft am 22.08.2026, Zeile 71 und 101: Das vermeintliche Passwort ist das
# deutsche PLATZHALTERWORT "PASSWORT": Beide Stellen erklaeren, dass der Wert von
# POSTGRES_PASSWORD unveraendert in die Verbindungszeichenkette wandert (postgres-Schema,
# Benutzer postgres, an der Passwortstelle steht im Beispiel das Wort PASSWORT statt eines
# Werts) — ausgerechnet in dem Skript, dessen einzige Aufgabe es ist, falsch konfigurierte
# Geheimnisse zu FINDEN. Der String kommt im ganzen Repository sonst nirgends vor und steht
# in keiner .env (beides gegengeprueft). Die zwei Treffer trieben allein das
# Security-Rating des Projekts von A auf E — ein Rating, das eine Kommentarzeile misst,
# verdeckt beim naechsten Mal einen echten Fund.
# Fuer JEDE andere Datei bleibt die Regel voll aktiv.
sonar.issue.ignore.multicriteria.e4.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.e4.resourceKey=scripts/pruefe_secrets.sh

# javascript:S2925 in den beiden Mess-Specs: Dieselbe Begruendung wie e3, andere Bauform.
# Beide Dateien messen gerenderte Geometrie (Kontrastwerte, Control-Hoehen) und warten dafuer
# in einer Schleife, bis sich ZWEI aufeinanderfolgende Messungen nicht mehr unterscheiden —
# "der Baum steht still" ist die Bedingung. Genau darauf laesst sich mit expect.poll nicht
# synchronisieren: Es gibt kein Ereignis fuer "es aendert sich nichts mehr", und eine
# Assertion auf einen konkreten Wert waere das, was der Test erst herausfinden soll.
# Die 50-80 ms sind der Takt der Stabilitaetspruefung, keine geratene Setzzeit.
sonar.issue.ignore.multicriteria.e5.ruleKey=javascript:S2925
sonar.issue.ignore.multicriteria.e5.resourceKey=**/suchpille-einheitlich.spec.js
sonar.issue.ignore.multicriteria.e6.ruleKey=javascript:S2925
sonar.issue.ignore.multicriteria.e6.resourceKey=**/rundgang-alle-routen.spec.js

# Die Generalprobe (scripts/generalprobe) läuft in einem Wegwerf-Stack: Postgres hört nur auf
# 127.0.0.1:5436, das Backend hängt an einem Netz ohne Weg nach draußen, die Anmeldung geht
# gegen die IMAP-Attrappe, und das Skript löscht den Stack am Ende samt Volumes. Vier Regeln
# melden dort Werte, die nur in diesem Stack gelten:
# - secrets:S6698: das Datenbank-Passwort des Stacks in docker-compose.yml und generalprobe.sh;
# - python:S2068: das Passwort in theke.py, das die Attrappe ungeprüft annimmt;
# - python:S5332: die Adresse http://bibliothek-backend-probe:8086 im internen Netz;
# - python:S2245: random.Random mit festem Startwert in probe_host.py. Er wählt die Stichprobe
#   der Exemplare und macht sie wiederholbar; ein Schlüssel entsteht daraus nicht.
# Die drei Treffer zu S6698 setzen die Sicherheitsnote des Projekts auf E, und eine Note, die
# an Wegwerf-Werten hängt, verdeckt einen echten Fund. Für jede andere Datei bleiben die vier
# Regeln aktiv.
sonar.issue.ignore.multicriteria.e7.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.e7.resourceKey=scripts/generalprobe/**
sonar.issue.ignore.multicriteria.e8.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.e8.resourceKey=scripts/generalprobe/**
sonar.issue.ignore.multicriteria.e9.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e9.resourceKey=scripts/generalprobe/**
sonar.issue.ignore.multicriteria.e10.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.e10.resourceKey=scripts/generalprobe/**

# javascript:S4036 (Programm wird über PATH gesucht) in frontend/e2e/mailserver.js: Der Helfer
# der Browser-Tests ruft `docker exec … psql` auf dem Rechner, der die Tests fährt. Im
# ausgelieferten Programm läuft er nicht. Für jede andere Datei bleibt die Regel aktiv.
sonar.issue.ignore.multicriteria.e11.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e11.resourceKey=frontend/e2e/mailserver.js

# javascript:S7776 (Set statt Liste für die Enthalten-Prüfung) wird in `.svelte.js`-Dateien nicht
# erzwungen. Dort verlangt die ESLint-Regel svelte/prefer-svelte-reactivity für jedes `new Set`
# ein SvelteSet, auch wenn der Wert nur innerhalb einer Funktion lebt und nie beobachtet wird.
# Die beiden gemeldeten Stellen (auflagenSuche.svelte.js, bookTableAuswahl.svelte.js) halten
# deshalb eine Liste; der Grund steht jeweils an der Stelle. Für gewöhnliche `.js`-Dateien
# bleibt die Regel aktiv.
sonar.issue.ignore.multicriteria.e12.ruleKey=javascript:S7776
sonar.issue.ignore.multicriteria.e12.resourceKey=**/*.svelte.js

# javascript:S2925 in sieben weiteren Specs, Begründung wie e3: Die feste Wartezeit ist das
# Fenster, in dem etwas nicht geschehen darf. Auf das Ausbleiben lässt sich nicht warten.
# - kiosk-scannerfokus: Ein Scan hinter einem offenen Dialog wird nicht verbucht.
# - schlagworte-pflege, titelliste-suche-rennen: Eine verspätete Antwort überschreibt den
#   neueren Stand nicht.
# - selbstanmeldung: Die Meldung bleibt länger stehen als die vier Sekunden einer Fehlermeldung.
# - sperrbildschirm: Nach dem Neuladen folgt keine Schleife von Anfragen.
# - titel-bearbeiten-ohne-liste: Die Titelliste wird kein zweites Mal geladen.
# - kamera-liest (e2e-proben, läuft nur von Hand): In acht Sekunden vor der Kamera entsteht
#   genau eine Buchung, keine zweite.
# Wo dieselben Dateien auf ein Ereignis warten, nutzen sie expect und expect.poll.
sonar.issue.ignore.multicriteria.e13.ruleKey=javascript:S2925
sonar.issue.ignore.multicriteria.e13.resourceKey=**/kiosk-scannerfokus.spec.js
sonar.issue.ignore.multicriteria.e14.ruleKey=javascript:S2925
sonar.issue.ignore.multicriteria.e14.resourceKey=**/schlagworte-pflege.spec.js
sonar.issue.ignore.multicriteria.e15.ruleKey=javascript:S2925
sonar.issue.ignore.multicriteria.e15.resourceKey=**/titelliste-suche-rennen.spec.js
sonar.issue.ignore.multicriteria.e16.ruleKey=javascript:S2925
sonar.issue.ignore.multicriteria.e16.resourceKey=**/selbstanmeldung.spec.js
sonar.issue.ignore.multicriteria.e17.ruleKey=javascript:S2925
sonar.issue.ignore.multicriteria.e17.resourceKey=**/sperrbildschirm.spec.js
sonar.issue.ignore.multicriteria.e18.ruleKey=javascript:S2925
sonar.issue.ignore.multicriteria.e18.resourceKey=**/titel-bearbeiten-ohne-liste.spec.js
sonar.issue.ignore.multicriteria.e19.ruleKey=javascript:S2925
sonar.issue.ignore.multicriteria.e19.resourceKey=**/kamera-liest.spec.js

# javascript:S2925 in zwei Gates über alle Routen, Begründung wie e5 und e6: Gemessen wird die
# Seite im Ruhezustand (Inhalt gerendert, Übergänge ausgelaufen). Ein Ereignis dafür gibt es
# nicht, und die Routen haben kein gemeinsames Element, auf das sich warten ließe.
sonar.issue.ignore.multicriteria.e20.ruleKey=javascript:S2925
sonar.issue.ignore.multicriteria.e20.resourceKey=**/barrierefreiheit-axe.spec.js
sonar.issue.ignore.multicriteria.e21.ruleKey=javascript:S2925
sonar.issue.ignore.multicriteria.e21.resourceKey=**/m3-bauform.spec.js
