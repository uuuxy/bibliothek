services:
  postgres-db:
    # Ohne diese Zeile kommen die Container nach einem Neustart des Docker-Daemons NICHT
    # von allein zurueck. Genau das ist am Prod-Server passiert: unattended-upgrades
    # startete den Daemon neu, und der Dienst lag zwoelf Stunden still, bis es jemandem
    # auffiel. Die Policy stand seither direkt auf dem Server in dieser Datei — als
    # uncommitteter Hotfix, der jedes `git pull` blockierte ("Your local changes to the
    # following files would be overwritten by merge"). Sie gehoert ins Repo.
    restart: unless-stopped
    # Log-Rotation (Wachstums-Sweep 21.08.2026): Der Docker-Default json-file kennt
    # KEINE Groessengrenze — auf dem Prod-Host ist kein daemon.json konfiguriert,
    # jede Request-Logzeile bleibt fuer immer liegen. Das faellt nicht in Wochen auf,
    # sondern in dem Moment, in dem die Platte voll ist (und mit ihr die Datenbank
    # desselben Hosts). 3 x 10 MB pro Container reichen fuer Tage Diagnose-Rueckblick.
    logging: &log_rotation
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Upgrade 15 → 18 am 31.08.2026, VOR dem ersten Piloten — ein Major-Wechsel ist
    # jetzt ein Dump/Restore ohne Nutzer, später ein Wartungsfenster mit Risiko.
    # Lokaler Stack (docker-compose.local.yml) und CI fahren dieselbe Major-Version;
    # der pg_dump-Client im Backend-Image (Dockerfile) MUSS bei jedem weiteren
    # Server-Upgrade mitziehen, sonst schlägt die Restore-Probe sonntags Alarm.
    image: postgres:18-alpine
    container_name: bibliothek-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein (siehe .env / .env.example)}
      - POSTGRES_DB=${POSTGRES_DB:-bibliothek}
    volumes:
      # Seit dem 18er-Image liegt PGDATA unter /var/lib/postgresql/18/docker und das
      # deklarierte Volume ist /var/lib/postgresql (nicht mehr …/data). Der alte Mount
      # auf …/data ginge ins Leere: die Daten landeten in einem ANONYMEN Volume und
      # wären beim nächsten Neuerstellen des Containers weg. Bestandsdaten aus einem
      # 15er-Volume sind hier NICHT startbar — Umzug nur per Dump/Restore
      # (docs/DEPLOYMENT.md, Abschnitt Major-Upgrade).
      - postgres_data:/var/lib/postgresql
    ports:
      # Nur an localhost binden — wie das Backend eine Zeile tiefer. "5434:5432"
      # veröffentlichte den Port auf ALLEN Interfaces: Wer den Host im Netz
      # erreichte, sprach mit dem DSN aus der .env direkt die Datenbank an, vorbei
      # an jeder Rolle, jedem Audit-Log und jeder Anonymisierung — inklusive aller
      # Schüler- und Ausleihdaten. Das Backend braucht diesen Port nicht (es geht
      # über das Docker-Netz an postgres-db:5432); er existiert nur für Werkzeuge
      # auf dem Server selbst. Von einem anderen Rechner aus: SSH-Tunnel.
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bibliothek}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # Siehe postgres-db: dieselbe Policy, derselbe Grund — auch bei der Log-Rotation.
    restart: unless-stopped
    logging: *log_rotation
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Wandert als ENV ins Image. update.sh vergleicht den Wert nach dem Deploy mit
        # `git rev-parse HEAD` und beantwortet damit die Frage, die kein Healthcheck
        # beantwortet: Laeuft der Container, der aus DIESEM Commit gebaut wurde?
        # Fehlt die Variable, bleibt der Wert leer — ein Build von Hand geht weiterhin.
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: bibliothek-backend
    ports:
      # Nur an localhost binden: Caddy erreicht das Backend über das Docker-Netz
      # (bibliothek-backend:8083), nicht über diesen Host-Port. 0.0.0.0-Binding
      # würde das Backend im LAN direkt erreichbar machen und das Vertrauen in die
      # privaten Proxy-Netze (TRUSTED_PROXIES) unterlaufen (XFF-Spoofing).
      - "127.0.0.1:8083:8083"
    environment:
      - PORT=8083
      - DB_HOST=postgres-db
      # Vertrauenswürdige Proxy-Netze für die echte Client-IP (Rate-Limiting,
      # Login-Brute-Force, Audit-Logs). Default = private Docker-Netze, damit die
      # von Caddy angehängte X-Forwarded-For-Client-IP ausgewertet wird.
      #
      # Der Default ist bewusst weit: Das echte Subnetz von caddy_global_net vergibt
      # der Docker-Daemon des JEWEILIGEN Hosts (Entwicklungsrechner 172.19.0.0/16,
      # Schulserver möglicherweise anders). Ein zu enger Wert fällt nicht als Fehler
      # auf — er lässt still jede Client-IP auf die Proxy-Adresse zusammenfallen.
      #
      # Seit dem 05.09.2026 darf der Default so weit sein: pkg/clientip vertraut genau
      # EINEM Hop und nimmt den rechtesten X-Forwarded-For-Eintrag, den Caddy angehängt
      # hat. Vorher übersprang es rekursiv jeden Eintrag aus diesen Netzen — und weil die
      # Schul-Clients selbst in 192.168.x/10.x liegen, wurden sie als „Proxy" übersprungen:
      # Die ganze Schule zählte als EIN Client (Login-Sperre für alle nach 50 Fehlversuchen).
      # Die Liste sagt nur noch, WER den Header setzen darf, nicht, wer Client ist.
      #
      # Enger fassen geht weiterhin; auf dem Zielhost ermitteln mit:
      #   docker network inspect caddy_global_net \
      #     --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
      #
      # Das Backend lauscht nur auf 127.0.0.1 (siehe oben), erreichbar ist es also
      # ausschließlich über Caddy im Docker-Netz. Ein gefälschter X-Forwarded-For von
      # außen kommt gar nicht erst an.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      # ── Sicherheit / Secrets ────────────────────────────────────────────────
      # JWT_SECRET und APP_ENCRYPTION_KEY haben KEINEN Default mehr (05.09.2026). Bis
      # dahin standen hier zwei Werte, die öffentlich im Repository nachzulesen waren,
      # und ENFORCE_PROD_SECRETS musste ausdrücklich auf true gesetzt werden, damit der
      # Server sie ablehnt. Eine vergessene .env-Zeile reichte, um den Schulserver mit
      # fälschbaren Admin-Sitzungen zu betreiben — ohne dass irgendetwas rot wurde.
      # Jetzt startet der Stack ohne die beiden Werte gar nicht, und die Verweigerung
      # bekannter Beispielwerte ist im Server die Vorgabe (api.ErzwingeProdGeheimnisse);
      # nur ein ausdrückliches ENFORCE_PROD_SECRETS=false schaltet sie für eine Testphase ab.
      #   JWT_SECRET=<zufällig, >=32 Zeichen>        z. B. openssl rand -base64 48
      #   APP_ENCRYPTION_KEY=<exakt 32 Byte>         z. B. openssl rand -hex 16
      #   POSTGRES_PASSWORD=<eigenes Passwort>
      #   COOKIE_SECURE=true   # hinter Caddy-HTTPS
      - APP_ENV=${APP_ENV:-production}
      - ENFORCE_PROD_SECRETS=${ENFORCE_PROD_SECRETS:-}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein (siehe .env)}@postgres-db:5432/${POSTGRES_DB:-bibliothek}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET muss gesetzt sein (>=32 Zeichen, zufaellig - siehe .env.example)}
      # Vorgabe true, nicht false: Dieser Stack läuft hinter Caddy (caddy_global_net,
      # Backend nur auf 127.0.0.1) — also über HTTPS. Ein Default von false setzte die
      # Variable auf den unsicheren Wert und hebelte damit die sichere Vorgabe in
      # ermittleCookieSecure() aus, die nur bei NICHT gesetzter Variable greift.
      # Nur überschreiben, wenn die Anwendung ausschließlich über HTTP im LAN läuft.
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY muss gesetzt sein (exakt 32 Byte - siehe .env.example)}
      # KEIN Default: "mock" ließ AuthenticateIMAP jedes Passwort für jede in
      # benutzer vorhandene E-Mail durchwinken (auth/imap.go). Als Compose-Default
      # stand damit in diesem Prod-Stack die Anmeldung faktisch offen, sofern
      # niemand die Variable bewusst überschrieb. Fehlt sie jetzt, startet der
      # Stack gar nicht erst. Der Server verweigert den Start zusätzlich, wenn
      # außerhalb von APP_ENV=local/development/test doch "mock" gesetzt wird.
      - IMAP_HOST=${IMAP_HOST:?IMAP_HOST muss gesetzt sein - der Wert mock akzeptiert JEDES Passwort und ist nur lokal erlaubt}
      # Leer = Selbstanmeldung aus. Muss hier stehen: Compose reicht ohne env_file
      # ausschliesslich die aufgefuehrten Variablen durch (siehe Backup-Block unten).
      - SELBSTANMELDUNG_DOMAIN=${SELBSTANMELDUNG_DOMAIN:-}
      # Ausserordentlicher Testzugang (auth/testzugang.go). Leer = es gibt ihn nicht.
      # Dieselbe Pflicht wie eine Zeile hoeher: Ohne diese beiden Eintraege staende der
      # Wert zwar in der .env, kaeme aber nie im Container an — und der Zugang waere
      # eine Einstellung, die nichts bewirkt.
      - TESTZUGANG_EMAIL=${TESTZUGANG_EMAIL:-}
      - TESTZUGANG_PASSWORT=${TESTZUGANG_PASSWORT:-}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-pflasch@philipp-reis-schule.de}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_PASS=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_SENDER=${SMTP_FROM}
      # Backup-Variablen MÜSSEN hier stehen: Compose reicht ohne env_file ausschließlich
      # die hier gelisteten Schlüssel durch. Sie fehlten — der nächtliche Backup-Job fand
      # deshalb im Container nie einen Schlüssel und übersprang sich STILL (jobs/backup.go),
      # obwohl BACKUP_ENCRYPTION_KEY in der .env stand. Ein Backup, das lautlos ausfällt,
      # merkt man erst, wenn man es braucht.
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
      - BACKUP_DIR=${BACKUP_DIR:-/app/backups}
      # Offsite-Ziel (optional): Ohne diese Zeilen kam S3_* aus der .env NIE im Container
      # an — die Selbstprüfung riet „S3_* in der .env setzen", und das blieb wirkungslos
      # (Prüfung 22.08.2026; gleiche Klasse wie BACKUP_ENCRYPTION_KEY oben). Leer = aus.
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_USE_SSL=${S3_USE_SSL:-true}
    volumes:
      - bibliothek_uploads:/app/uploads
      - bibliothek_backups:/app/backups
    depends_on:
      postgres-db:
        condition: service_healthy


volumes:
  postgres_data:
  bibliothek_uploads:
  # Benanntes Volume, damit die verschlüsselten Dumps einen Container-Neubau überleben.
  bibliothek_backups:

networks:
  default:
    name: caddy_global_net
    external: true
