services:
  postgres-db:
    # Ohne diese Zeile kommen die Container nach einem Neustart des Docker-Daemons (etwa durch
    # unattended-upgrades) nicht von allein zurück. Sie steht im Repo: Eine Änderung von Hand
    # in dieser Datei auf dem Server blockiert jedes `git pull`.
    restart: unless-stopped
    # Log-Rotation: Der Docker-Default json-file kennt keine Größengrenze; ohne daemon.json
    # bliebe jede Request-Logzeile liegen, bis die Platte voll ist — und mit ihr die Datenbank
    # desselben Hosts. 3 x 10 MB pro Container reichen für Tage Diagnose-Rückblick.
    logging: &log_rotation
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Lokaler Stack (docker-compose.local.yml) und CI fahren dieselbe Major-Version; der
    # pg_dump-Client im Backend-Image (Dockerfile) zieht bei jedem Server-Upgrade mit, sonst
    # schlägt die Restore-Probe sonntags Alarm. Ein Major-Wechsel geht nur per Dump/Restore.
    image: postgres:18-alpine
    container_name: bibliothek-db
    # Nur im eigenen Netz: Am gemeinsamen Netz caddy_global_net erreichte jeder andere Container
    # den Port der Datenbank, und ihn hielte allein das Passwort auf.
    networks:
      - intern
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein (siehe .env / .env.example)}
      - POSTGRES_DB=${POSTGRES_DB:-bibliothek}
    volumes:
      # Seit dem 18er-Image liegt PGDATA unter /var/lib/postgresql/18/docker und das
      # deklarierte Volume ist /var/lib/postgresql (nicht mehr …/data). Der alte Mount
      # auf …/data ginge ins Leere: die Daten landeten in einem ANONYMEN Volume und
      # wären beim nächsten Neuerstellen des Containers weg. Bestandsdaten aus einem
      # 15er-Volume sind hier NICHT startbar — Umzug nur per Dump/Restore
      # (docs/DEPLOYMENT.md, Abschnitt Major-Upgrade).
      - postgres_data:/var/lib/postgresql
    ports:
      # Nur an localhost binden — wie das Backend weiter unten. "5434:5432" allein
      # veröffentlicht den Port auf allen Interfaces: Wer den Host im Netz erreicht, spräche
      # mit dem DSN aus der .env direkt die Datenbank an, vorbei an jeder Rolle, jedem
      # Audit-Log und jeder Anonymisierung. Das Backend braucht diesen Port nicht (es geht
      # über das Docker-Netz an postgres-db:5432); er existiert nur für Werkzeuge auf dem
      # Server selbst. Von einem anderen Rechner aus: SSH-Tunnel.
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bibliothek}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # Siehe postgres-db: dieselbe Policy, derselbe Grund — auch bei der Log-Rotation.
    restart: unless-stopped
    logging: *log_rotation
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Wandert als ENV ins Image. update.sh vergleicht den Wert nach dem Deploy mit
        # `git rev-parse HEAD` und beantwortet damit die Frage, die kein Healthcheck
        # beantwortet: Laeuft der Container, der aus DIESEM Commit gebaut wurde?
        # Fehlt die Variable, bleibt der Wert leer — ein Build von Hand geht weiterhin.
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: bibliothek-backend
    ports:
      # Nur an localhost binden: Caddy erreicht das Backend über das Docker-Netz
      # (bibliothek-backend:8083), nicht über diesen Host-Port. 0.0.0.0-Binding
      # würde das Backend im LAN direkt erreichbar machen und das Vertrauen in die
      # privaten Proxy-Netze (TRUSTED_PROXIES) unterlaufen (XFF-Spoofing).
      - "127.0.0.1:8083:8083"
    environment:
      - PORT=8083
      # Vertrauenswürdige Proxy-Netze für die echte Client-IP (Rate-Limiting,
      # Login-Brute-Force, Audit-Logs). Default = private Docker-Netze, damit die
      # von Caddy angehängte X-Forwarded-For-Client-IP ausgewertet wird.
      #
      # Der Default ist bewusst weit: Das echte Subnetz von caddy_global_net vergibt
      # der Docker-Daemon des JEWEILIGEN Hosts (Entwicklungsrechner 172.19.0.0/16,
      # Schulserver möglicherweise anders). Ein zu enger Wert fällt nicht als Fehler
      # auf — er lässt still jede Client-IP auf die Proxy-Adresse zusammenfallen.
      #
      # Der Default darf so weit sein: pkg/clientip vertraut genau einem Hop und nimmt den
      # rechten X-Forwarded-For-Eintrag, den Caddy angehängt hat. Die Liste sagt nur, wer den
      # Header setzen darf, nicht, wer Client ist; die Geräte der Schule liegen selbst in
      # 192.168.x/10.x und zählen so jedes für sich.
      #
      # Enger fassen geht weiterhin; auf dem Zielhost ermitteln mit:
      #   docker network inspect caddy_global_net \
      #     --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
      #
      # Enger zu fassen bringt dagegen nichts: Nur der Host-Port hängt an 127.0.0.1. Im Netz
      # caddy_global_net erreicht jeder Container das Backend direkt und liegt im selben
      # Subnetz wie Caddy, gälte also auch bei engster Liste als Proxy. Deshalb hängen dort nur
      # Caddy und Dienste, denen der Server vertraut; die Datenbank hat ihr eigenes Netz.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      # ── Sicherheit / Secrets ────────────────────────────────────────────────
      # JWT_SECRET und APP_ENCRYPTION_KEY haben keinen Default: Ein Wert, der im öffentlichen
      # Repository steht, erlaubte fälschbare Admin-Sitzungen. Ohne die beiden Werte startet der
      # Stack nicht, und die Verweigerung bekannter Beispielwerte ist im Server die Vorgabe
      # (bereitschaft.IstGeheimnisSchutzScharf); nur ein ausdrückliches
      # ENFORCE_PROD_SECRETS=false schaltet sie für eine Testphase ab.
      #   JWT_SECRET=<zufällig, >=32 Zeichen>        z. B. openssl rand -hex 32
      #   APP_ENCRYPTION_KEY=<exakt 32 Byte>         z. B. openssl rand -hex 32
      #   POSTGRES_PASSWORD=<eigenes Passwort>
      # Fest, nicht aus der .env: local, development und test schalten die Prüfung der
      # Beispiel-Geheimnisse und die Umleitung auf HTTPS ab und lassen IMAP_HOST=mock zu, das jedes
      # Passwort annimmt. Den lokalen Stack setzt docker-compose.local.yml.
      - APP_ENV=production
      - ENFORCE_PROD_SECRETS=${ENFORCE_PROD_SECRETS:-}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein (siehe .env)}@postgres-db:5432/${POSTGRES_DB:-bibliothek}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET muss gesetzt sein (>=32 Zeichen, zufaellig - siehe .env.example)}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY muss gesetzt sein (exakt 32 Byte - siehe .env.example)}
      # Kein Default: Die Attrappe "mock" (auth/imap.go) nimmt jedes Passwort für jede in
      # benutzer vorhandene E-Mail an; als Vorgabe stünde die Anmeldung offen. Fehlt die
      # Variable, startet der Stack nicht. Der Server verweigert den Start zusätzlich, wenn
      # außerhalb von APP_ENV=local/development/test doch "mock" gesetzt ist.
      - IMAP_HOST=${IMAP_HOST:?IMAP_HOST muss gesetzt sein - der Wert mock akzeptiert JEDES Passwort und ist nur lokal erlaubt}
      # Leer = Selbstanmeldung aus. Muss hier stehen: Compose reicht ohne env_file
      # ausschliesslich die aufgefuehrten Variablen durch (siehe Backup-Block unten).
      - SELBSTANMELDUNG_DOMAIN=${SELBSTANMELDUNG_DOMAIN:-}
      # Keine Vorgabe: Die Adresse des ersten Admins gehört in die .env des Servers. Gelesen wird
      # sie nur bei leerer Tabelle benutzer, und dann bricht der Start ohne sie ab.
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_PASS=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      # Backup-Variablen stehen hier, weil Compose ohne env_file nur die hier gelisteten
      # Schlüssel durchreicht. Fehlte eine, fände der nächtliche Backup-Job im Container keinen
      # Schlüssel und übersprünge sich still (jobs/backup.go), auch wenn sie in der .env steht.
      # Ein Backup, das lautlos ausfällt, merkt man erst, wenn man es braucht.
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
      - BACKUP_DIR=${BACKUP_DIR:-/app/backups}
      # Offsite-Ziel (optional), aus demselben Grund aufgeführt: Ohne diese Zeilen käme S3_*
      # aus der .env nie im Container an, und der Rat der Selbstprüfung „S3_* in der .env
      # setzen" bliebe wirkungslos. Leer = aus.
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_USE_SSL=${S3_USE_SSL:-true}
      - SENTRY_DSN=${SENTRY_DSN:-}
      # Fünf Variablen, die der Server liest; ohne diese Zeilen gälte im Container immer die
      # eingebaute Vorgabe, egal was in der .env steht. Leer ergibt bei allen fünf die Vorgabe
      # (RATE_LIMIT 50, IMAP_PORT 993, ALLOWED_ORIGIN = Host der Anfrage; die beiden
      # SMTP_ALLOW_* wirken nur bei "true", und dann warnt System → Betriebsbereitschaft).
      # Gate: docs/compose_variablen_test.go.
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-}
      - RATE_LIMIT=${RATE_LIMIT:-}
      - IMAP_PORT=${IMAP_PORT:-}
      - SMTP_ALLOW_INSECURE_TLS=${SMTP_ALLOW_INSECURE_TLS:-}
      - SMTP_ALLOW_PLAINTEXT=${SMTP_ALLOW_PLAINTEXT:-}
      # Der frühere Zweitname des AES-Schlüssels. Gelesen wird er nicht mehr — main.go bricht
      # aber den Start ab, wenn er gesetzt ist und von APP_ENCRYPTION_KEY abweicht. Ohne diese
      # Zeile käme er nie im Container an, und die Prüfung könnte dort nie auslösen.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    volumes:
      - bibliothek_uploads:/app/uploads
      - bibliothek_backups:/app/backups
    depends_on:
      postgres-db:
        condition: service_healthy
    # caddy_global_net für Caddy, intern für die Datenbank.
    networks:
      - default
      - intern


volumes:
  postgres_data:
  bibliothek_uploads:
  # Benanntes Volume, damit die verschlüsselten Dumps einen Container-Neubau überleben.
  bibliothek_backups:

networks:
  default:
    name: caddy_global_net
    external: true
  # Backend und Datenbank, sonst nichts.
  intern:
