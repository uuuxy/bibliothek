# Dependabot — hält Abhängigkeiten aktuell, indem es neue Versionen erkennt und pro
# Ökosystem gebündelte Pull Requests öffnet. Jeder PR durchläuft die volle CI (inkl.
# des Frontend-Builds über den docker build in security-scan.yml) — ein Update, das
# etwas bricht, wird rot und darf nicht gemergt werden.
#
# Ohne Auto-Merge: Erst soll sich zeigen, dass die Gates die Update-PRs zuverlässig prüfen
# — ein Patch-Update kann den Build brechen, und das fängt nur `npm run build`. Wenn das
# Vertrauen da ist, lässt sich Auto-Merge für patch/minor über einen kleinen Workflow
# nachrüsten. Major-Updates bleiben in jedem Fall manuell.
#
# Dependabot aktualisiert gezielt die direkten Abhängigkeiten, kein pauschales
# `npm update`, das jede transitive mit hebt.
#
# cooldown: Eine neue Fassung wird erst nach sieben Tagen vorgeschlagen. Ein kompromittiertes
# Release fällt meist in dieser Zeit auf und wird zurückgezogen. Sicherheits-Updates betrifft
# das nicht: „The cooldown option is only available for version updates, not security updates."
# (GitHub Docs, Dependabot options reference).

version: 2
updates:
  # ── Go-Backend ────────────────────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    # Major-Updates kommen als einzelne PRs (nicht in der Gruppe), damit sie auffallen.

  # ── Frontend (npm) ────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 ist ein Major-Sprung mit möglichen Breaking Changes — bewusst
      # zurückgehalten, bis er separat und getestet gezogen wird. Diese Zeile hindert
      # Dependabot daran, ihn als offenen PR immer wieder vorzuschlagen. Beim bewussten
      # Umstieg entfernen.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # ── Docker-Basis-Images (Dockerfile) ──────────────────────────────────────
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  # ── GitHub-Actions-Workflows ──────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-all:
        patterns: ["*"]
