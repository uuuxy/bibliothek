name: Security – Dependency Vulnerability Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run every Monday at 07:00 UTC to catch newly published CVEs
    - cron: "0 7 * * 1"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  # Ohne `actions: read`: Die vier Prüfungen hier brauchen es nicht; CodeQL läuft über das
  # Standard-Setup (unten).

# Actions per Commit-SHA, Runner fest auf ubuntu-26.04 — warum: Kopf von ci.yml.


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Go: govulncheck (official Go Vulnerability Database) ──────────────────
  go-vuln-scan:
    name: Go – govulncheck
    runs-on: ubuntu-26.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Feste Version statt @latest: Ein neues Release soll die Prüfung nicht
      # ungefragt ändern. Die Schwachstellen-Datenbank lädt govulncheck bei jedem Lauf frisch;
      # festgeschrieben ist nur das Werkzeug. Heben wie Go selbst (PFLEGEKONZEPT.md, Abschnitt 4).
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run govulncheck
        # Über das Gate-Skript statt direkt: Es kennt eine benannte Ausnahmeliste
        # (security/vuln-ausnahmen.json) mit Grund, Nachweis und Wiedervorlage und wird
        # rot bei allem, was nicht drinsteht — und ebenso bei einer abgelaufenen oder
        # überflüssig gewordenen Ausnahme. Dieselbe Prüfung wie im pre-push-Hook.
        run: ./scripts/govulncheck-gate.sh

  # ── Go: gosec (static security analysis) ─────────────────────────────────
  go-sec-scan:
    name: Go – gosec static analysis
    runs-on: ubuntu-26.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Über das Gate-Skript statt direkt: Es trägt die feste Fassung, den Aufruf und die
      # ausgenommenen Regeln samt Grund, und es baut das Werkzeug selbst. Der Hook vor dem Push
      # ruft dasselbe Skript.
      - name: Run gosec
        run: ./scripts/gosec-gate.sh

  # ── CodeQL steht nicht hier ──────────────────────────────────────────────
  #
  # Für dieses Repository ist GitHubs Standard-Setup ("Default setup") aktiv und analysiert
  # go, javascript-typescript und actions (Checks "Analyze (…)"). Ein eigener CodeQL-Job
  # verträgt sich damit nicht: Er scheitert am Schritt "Perform CodeQL Analysis", weil das
  # Hochladen abgelehnt wird, solange das Standard-Setup aktiv ist.
  #
  # Wer hier je einen eigenen Job braucht (eigene Query-Suiten, anderer Build-Modus), muss
  # zuerst das Standard-Setup in den Repository-Einstellungen abschalten
  # (Settings → Code security → Code scanning).
  npm-audit:
    name: npm – audit (frontend)
    runs-on: ubuntu-26.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (CI mode – no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Run npm audit
        # --audit-level=high: fail on HIGH and CRITICAL vulnerabilities only
        # moderate/low are reported but do not block CI in a school context
        #
        # Ein Ausfall der Registry ist kein Befund: npms Audit-Endpunkt ist manchmal kurz weg
        # und antwortet dann mit `{ error: 'Service Unavailable' }`. Ein Gate, das bei einem
        # fremden Ausfall rot wird, erzieht zum Wegsehen. Deshalb: dreimal versuchen, und nur
        # ein echter Befund ist rot. Bleibt der Endpunkt unerreichbar, endet der Schritt gelb
        # mit einer Warnung im Protokoll statt rot.
        run: |
          set -uo pipefail
          for versuch in 1 2 3; do
            ausgabe=$(npm audit --audit-level=high --omit=dev 2>&1) && { echo "$ausgabe"; exit 0; }
            echo "$ausgabe"
            if ! grep -qiE "audit endpoint returned an error|Service Unavailable|ENOTFOUND|ETIMEDOUT|ECONNRESET" <<<"$ausgabe"; then
              echo "::error::npm audit meldet eine Schwachstelle (HIGH oder CRITICAL)."
              exit 1
            fi
            echo "Versuch $versuch: Audit-Endpunkt nicht erreichbar, neuer Versuch in 20 s …"
            sleep 20
          done
          echo "::warning::npm audit konnte den Endpunkt dreimal nicht erreichen — kein Befund, nur kein Ergebnis."

  # ── Docker image scan (Trivy) ─────────────────────────────────────────────
  docker-scan:
    name: Docker – Trivy image scan
    runs-on: ubuntu-26.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image for scanning
        run: docker build -t bibliothek:scan .

      # Gate gegen Laufzeitfehler, die kein Go-Test sehen kann: Fehlt ein Volume-Ziel im
      # Image, legt Docker es beim Mounten als root an, und der Container, der als appuser
      # läuft, kann nicht hineinschreiben — der nächtliche Backup-Job scheitert dann an
      # "permission denied", obwohl Schlüssel und pg_dump da sind.
      #
      # Geprüft wird gegen ein frisches Volume, weil genau das der Zustand auf einem neu
      # aufgesetzten Server ist.
      - name: Container-Smoke — Schreibrechte und Laufzeitwerkzeuge
        run: |
          set -euo pipefail
          docker volume rm -f biblio-ci-backups biblio-ci-uploads 2>/dev/null || true

          echo "→ Läuft der Container unprivilegiert?"
          docker run --rm bibliothek:scan id | tee /dev/stderr | grep -q "uid=1000(appuser)"

          echo "→ Sind die Werkzeuge da, die der Code per exec.Command aufruft?"
          docker run --rm bibliothek:scan sh -c 'command -v pg_dump'

          echo "→ Ist jedes Volume-Ziel für appuser beschreibbar?"
          docker run --rm \
            -v biblio-ci-backups:/app/backups \
            -v biblio-ci-uploads:/app/uploads \
            bibliothek:scan sh -c '
              set -e
              for d in /app/backups /app/uploads; do
                touch "$d/.ci-probe" || { echo "FEHLER: $d ist für appuser nicht beschreibbar"; ls -ld "$d"; exit 1; }
                rm -f "$d/.ci-probe"
                echo "  ok: $d"
              done'

          docker volume rm -f biblio-ci-backups biblio-ci-uploads

      - name: Run Trivy vulnerability scanner
        # Gepinnt statt @master: ein Branch ist kein Release, Dependabot kann ihn nicht
        # pflegen.
        #
        # Das `v` in der Fassung gehört dazu: aquasecurity veröffentlicht ab 0.36.0 nur noch
        # Tags mit `v`. Ein Tag, den es nicht gibt, lässt den Job nach einer Sekunde in
        # "Set up job" sterben ("Unable to resolve action"), und mit ihm alles, was in ihm
        # steckt: den Trivy-Scan des fertigen Images und den `docker build` samt seinen
        # Proben (pg_dump vorhanden, Volume-Ziele für appuser beschreibbar).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bibliothek:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"        # Fail CI if HIGH/CRITICAL found in final image
          ignore-unfixed: true  # Skip CVEs without fix available
