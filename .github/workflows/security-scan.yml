name: Security – Dependency Vulnerability Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run every Monday at 07:00 UTC to catch newly published CVEs
    - cron: "0 7 * * 1"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  actions: read           # Required for CodeQL action v4


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Go: govulncheck (official Go Vulnerability Database) ──────────────────
  go-vuln-scan:
    name: Go – govulncheck
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # govulncheck exits with code 3 if vulnerabilities are found → fail the build
        run: govulncheck ./...

  # ── Go: gosec (static security analysis) ─────────────────────────────────
  go-sec-scan:
    name: Go – gosec static analysis
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run gosec
        # Exclude G304 (file path from variable) and G401 (MD5/SHA1) – not applicable
        run: >
          gosec
          -exclude=G304,G401,G115,G404,G704,G101,G124,G120,G204,G110,G706,G703,G702
          ./...

  # ── npm: audit (Node.js/Svelte frontend dependencies) ────────────────────
  npm-audit:
    name: npm – audit (frontend)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (CI mode – no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Run npm audit
        # --audit-level=high: fail on HIGH and CRITICAL vulnerabilities only
        # moderate/low are reported but do not block CI in a school context
        run: npm audit --audit-level=high --omit=dev

  # ── Docker image scan (Trivy) ─────────────────────────────────────────────
  docker-scan:
    name: Docker – Trivy image scan
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: docker build -t bibliothek:scan .

      # Gate gegen Laufzeitfehler, die kein Go-Test sehen kann.
      #
      # Anlass (06.08.2026): /app/backups fehlte im Dockerfile. Docker legte das
      # Verzeichnis beim Mounten des Named Volume selbst an — als root. Der Container
      # läuft als appuser, und der nächtliche Backup-Job scheiterte seit dem 04.08. an
      # "permission denied". Auf der Produktion existierte dadurch KEIN einziges
      # verschlüsseltes Backup. BACKUP_ENCRYPTION_KEY war gesetzt, pg_dump lag im Image,
      # der Code war richtig — es fehlte ein Schreibrecht, das nur im echten Container
      # sichtbar wird.
      #
      # Geprüft wird gegen ein FRISCHES Volume, weil genau das der Zustand auf einem neu
      # aufgesetzten Server ist.
      - name: Container-Smoke — Schreibrechte und Laufzeitwerkzeuge
        run: |
          set -euo pipefail
          docker volume rm -f biblio-ci-backups biblio-ci-uploads 2>/dev/null || true

          echo "→ Läuft der Container unprivilegiert?"
          docker run --rm bibliothek:scan id | tee /dev/stderr | grep -q "uid=1000(appuser)"

          echo "→ Sind die Werkzeuge da, die der Code per exec.Command aufruft?"
          docker run --rm bibliothek:scan sh -c 'command -v pg_dump'

          echo "→ Ist jedes Volume-Ziel für appuser beschreibbar?"
          docker run --rm \
            -v biblio-ci-backups:/app/backups \
            -v biblio-ci-uploads:/app/uploads \
            bibliothek:scan sh -c '
              set -e
              for d in /app/backups /app/uploads; do
                touch "$d/.ci-probe" || { echo "FEHLER: $d ist für appuser nicht beschreibbar"; ls -ld "$d"; exit 1; }
                rm -f "$d/.ci-probe"
                echo "  ok: $d"
              done'

          docker volume rm -f biblio-ci-backups biblio-ci-uploads

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bibliothek:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"        # Fail CI if HIGH/CRITICAL found in final image
          ignore-unfixed: true  # Skip CVEs without fix available
