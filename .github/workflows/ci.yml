name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Kein Job schreibt ins Repo — der GITHUB_TOKEN braucht nur Lesezugriff.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Push-Serien: nur der jeweils neueste Lauf pro Branch zählt —
# veraltete Läufe werden abgebrochen und verbrennen keine Minuten.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # Aktiviert die DB-Integrationstests (db/constraints_pg_test.go). Ohne diese
      # Variable überspringen sie sich selbst — dann prüfte CI die DB-Invarianten nicht.
      # Der Name MUSS "test" enthalten: die Tests verwerfen das Schema (Notbremse in
      # pruefeTestDatenbank).
      # Ohne Passwort — siehe POSTGRES_HOST_AUTH_METHOD unten.
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/bibliothek_test?sslmode=disable

    # Postgres 15 = Produktionsversion. Die Constraint-Tests prüfen echtes
    # Postgres-Verhalten (z. B. dass ein CHECK nur bei FALSE greift, nicht bei NULL) —
    # das lässt sich mit pgxmock prinzipiell nicht nachbilden.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          # trust statt eines Wegwerf-Passworts: Der Container existiert nur für die
          # Dauer dieses Jobs, ist ausschliesslich über localhost des Runners
          # erreichbar und enthält nur Testdaten. Ein Passwort hier wäre kein
          # Sicherheitsgewinn, sondern nur ein Credential im Repository — und als
          # solches nicht von einem echten zu unterscheiden (SonarQube secrets:S6698).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: bibliothek_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out repository code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Verify dependencies
      run: go mod verify

    # Action v8 + gepinnte v2-Version: .golangci.yml nutzt das v2-Schema, und
    # goinstall@latest würde über den alten Modulpfad (ohne /v2) v1 installieren,
    # dessen "config verify" das v2-Schema ablehnt. Version = lokaler Stand.
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
        args: --timeout=5m

    # Erreichbarkeitsanalyse gegen toten Code (Anlass: UpsertBookTitle, 16.08.2026).
    # Das Schwester-Gate für tote INTERFACE-Türen — die deadcode nicht sehen kann —
    # ist tote_tueren_test.go und läuft im normalen Testschritt mit.
    - name: Deadcode-Gate
      run: ./scripts/deadcode_gate.sh

    # pg_dump/psql werden von der Restore-Probe (jobs/backup_drill_pg_test.go)
    # gebraucht: Sie erzeugt ein echtes verschlüsseltes Backup und spielt es in eine
    # frische Datenbank zurück. Fehlen die Werkzeuge, überspringt sich der Test selbst
    # — und ein übersprungener Notfallplan ist schlimmer als gar keiner, weil er wie
    # eine bestandene Probe aussieht. Deshalb hier ausdrücklich installieren und die
    # Version prüfen: pg_dump verweigert die Arbeit an einem NEUEREN Server.
    - name: Install PostgreSQL client (Restore-Probe)
      # timeout-minutes, weil dieser Schritt am 19.08.2026 ZWEIMAL an einem stillen
      # Paketspiegel hing (>20 min statt Sekunden) — ohne Limit wartet der Job bis
      # zum 6-Stunden-Abbruch und sieht dabei aus wie "läuft noch".
      timeout-minutes: 5
      run: |
        # Das Runner-Image bringt den Client in aller Regel schon mit; Client >= Server
        # genügt (pg_dump verweigert nur einen NEUEREN Server, Service ist Postgres 15).
        # apt ist nur die Rückfallebene für einen Image-Wechsel — und dann mit harten
        # Netz-Timeouts statt der apt-Vorgabe, die an einem hängenden Spiegel klebt.
        if ! command -v pg_dump >/dev/null 2>&1; then
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          sudo apt-get $APT_OPTS update -qq
          sudo apt-get $APT_OPTS install -y -qq postgresql-client
        fi
        pg_dump --version
        psql --version

    # pipefail ist Pflicht: Ohne ihn ist der Status der Pipeline der von `tee`, und ein
    # fehlgeschlagener Testlauf käme als grüner Schritt durch. GitHubs Vorgabe-Shell für
    # `run:` ist `bash -e` OHNE pipefail; `shell: bash` schaltet ihn ein.
    - name: Run Unit Tests
      shell: bash
      run: go test -v -race ./... 2>&1 | tee /tmp/gotest.log

    # Ein übersprungener Prüfpunkt sieht aus wie ein bestandener.
    #
    # Alle *_pg_test.go hängen an TEST_DATABASE_URL, die Restore-Probe zusätzlich an
    # pg_dump/psql. Fehlt eines davon, überspringen sie sich SELBST — und der Job bliebe
    # grün, obwohl Rechte-Seed, LUSD-Import und der Notfallplan gar nicht geprüft wurden.
    # Genau so stand am 10.08.2026 ein Rechte-Test acht Stunden falschherum auf main:
    # lokal übersprang er sich, weil der Pre-Push-Hook die Variable nicht setzt.
    #
    # Der Schritt bricht deshalb ab, wenn ein Test wegen fehlender Umgebung ausgefallen
    # ist, und schreibt die Skip-Bilanz ins Log — damit sichtbar bleibt, wie viel dieser
    # Lauf wirklich ausgeführt hat.
    # Was hat dieser Lauf NICHT ausgeführt?
    #
    # Ein übersprungener Prüfpunkt sieht aus wie ein bestandener. Ob eine Prüfung laufen
    # MUSS, entscheiden die Guards im Go-Code (db/pgtest_guard_test.go für die
    # DB-Invarianten, jobs/restore_drill_guard_test.go für den Notfallplan) — sie stehen
    # neben dem, was sie bewachen, und werden mit ihm zusammen gelesen.
    #
    # Dieser Schritt bricht deshalb nichts ab. Er schreibt die Bilanz ins Log, damit ein
    # NEUER stiller Skip sichtbar wird, für den noch niemand einen Guard geschrieben hat.
    # Legitime Skips gibt es: Die Littera-Läufe brauchen den echten Altbestand
    # (LITTERA_CSV_DIR, leser.csv, verleih.csv …), der nicht im Repo liegt.
    - name: Skip-Bilanz
      shell: bash
      run: |
        echo "── Diese Tests wurden übersprungen ──"
        grep -A 1 -E "^\s*--- SKIP" /tmp/gotest.log || echo "(kein Test übersprungen)"

  frontend-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
    - name: Check out repository code
      uses: actions/checkout@v7

    # cache: npm — npm ci zieht die Tarballs aus dem Runner-Cache statt aus der
    # Registry; das Netz wird nur noch gebraucht, wenn sich der Lockfile ändert.
    # Hintergrund 19.08.2026: Installationsschritte hingen mehrfach an gestörten
    # Spiegeln/Registries — die Abhängigkeit gehört weggecacht, nicht nur befristet.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      timeout-minutes: 10
      run: |
        cd frontend
        npm ci

    # ESLint lief bis zum 10.08.2026 NUR im pre-commit-Hook und dort mit --quiet, also
    # ohne Warnungen. In CI lief es gar nicht. Ergebnis: Ein Snippet verwarf seit dem
    # 27.07. die übergebene Icon-Größe, ESLint meldete das durchgehend, und niemand
    # konnte es sehen. Ein Hook greift außerdem nur bei dem, der ihn installiert hat —
    # CI ist die Stelle, die für alle gilt.
    - name: Run ESLint
      run: |
        cd frontend
        npm run lint

    - name: Run Vitest
      run: |
        cd frontend
        npm run test

  e2e:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
    - name: Check out repository code
      uses: actions/checkout@v7

    # cache: npm — siehe frontend-test: die Registry wird nur noch bei
    # Lockfile-Änderungen gebraucht.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    # Browser-Binaries (~130 MB CDN-Download) am Lockfile-Stand cachen: Bei
    # unverändertem Playwright ist `playwright install` damit ein No-op und der
    # CDN fällt als Ausfallquelle weg.
    - name: Cache Playwright-Browser
      id: pw-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

    # docker-compose.local.yml referenziert das externe Caddy-Netz des
    # Produktiv-Hosts — auf dem Runner muss es nur existieren.
    # POSTGRES_PASSWORD ist im Compose bewusst Pflicht ohne Default; für den
    # Wegwerf-Stack auf dem Runner reicht ein fester Dummy-Wert.
    - name: Start local stack
      env:
        POSTGRES_PASSWORD: ci-e2e-throwaway-password
      run: |
        docker network create caddy_global_net
        docker compose -f docker-compose.local.yml up -d --build
        for i in $(seq 1 60); do
          curl -sf http://localhost:8084/health >/dev/null && break
          sleep 2
        done
        curl -sf http://localhost:8084/health

    # Drei Schichten gegen die Störungsklasse vom 19.08.2026 (Installationen hingen
    # mehrfach >9 min an apt-Spiegel/Registry/CDN, normal: Sekunden bis 3 min):
    #   1. Cache (oben): npm-Tarballs + Browser-Binaries — das Netz ist im Normalfall
    #      kaum noch beteiligt. `install --with-deps` überspringt den Browser-Download bei
    #      Cache-Treffer und installiert nur die System-Abhängigkeiten via apt.
    #   2. wiederhole: jeder Versuch hart auf 4 min begrenzt (timeout), bis zu drei
    #      Versuche mit Backoff — ein hängender Spiegel kostet einen Versuch, nicht
    #      den Lauf.
    #   3. timeout-minutes als Reißleine, falls doch alles klemmt: roter Schritt zum
    #      Neustarten statt eines endlosen gelben.
    #
    # NICHT nach cache-hit in `install-deps` aufspalten: `install-deps` ruft `apt-get`
    # OHNE sudo auf und scheitert an "Unable to lock /var/lib/apt/lists/". Nur
    # `--with-deps` regelt die apt-Rechte selbst. Der Cache greift trotzdem — der
    # Browser-Download entfällt bei Treffer, die apt-Deps sind ohnehin nicht gecacht.
    #
    # ECHTE Wurzel der "Install hängt/scheitert"-Serie vom 19.08.2026: NICHT CDN-
    # Flakiness, sondern apt-LOCK-KONKURRENZ. Der runnereigene apt-daily/unattended-
    # upgrades-Prozess hält beim Job-Start die apt-Sperre; playwrights `--with-deps`
    # (das intern apt aufruft) scheitert daran. Ein Vorab-Warten auf die Sperre ist
    # gegen eine RACE machtlos — der Störer greift die Sperre WÄHREND playwrights
    # mehrminütigem apt-Lauf erneut (im letzten Lauf belegt: Lock von Prozess 8136).
    #
    # Definitiv gelöst durch die apt-Option DPkg::Lock::Timeout: apt WARTET dann auf die
    # Sperre, statt sofort zu scheitern. Global gesetzt wirkt es auch auf playwrights
    # interne apt-Aufrufe — kein Race, keine Warteschleife, kein Prozess-Kill.
    - name: Install Playwright
      timeout-minutes: 15
      run: |
        wiederhole() {
          for versuch in 1 2 3; do
            timeout 600 "$@" && return 0
            echo "::warning::Versuch $versuch fehlgeschlagen: $* — neuer Versuch"
            sleep $((versuch * 10))
          done
          return 1
        }
        # apt wartet bis zu 300 s auf die Sperre, statt an ihr zu scheitern.
        echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/99lock-timeout >/dev/null
        cd frontend
        wiederhole npm ci
        wiederhole npx playwright install --with-deps chromium

    - name: Run E2E tests
      run: |
        cd frontend
        npx playwright test

    - name: Upload traces on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-traces
        path: frontend/test-results/
        retention-days: 7

    - name: Backend logs on failure
      if: failure()
      run: docker logs bibliothek-backend-local --tail 200
