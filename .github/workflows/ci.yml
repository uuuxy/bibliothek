name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Probelauf gegen ein anderes Runner-Abbild, ohne Zweig und ohne Pull Request:
  #   gh workflow run ci.yml -f runner=ubuntu-24.04
  # Push und Pull Request bekommen kein `inputs` und laufen auf ubuntu-26.04.
  workflow_dispatch:
    inputs:
      runner:
        description: Runner-Abbild für einen Probelauf
        type: string
        default: ubuntu-26.04

# Kein Job schreibt ins Repo — der GITHUB_TOKEN braucht nur Lesezugriff.
permissions:
  contents: read

# In allen vier Workflows:
# - Jede Action per Commit-SHA, die Version als Kommentar dahinter. Einen Tag wie `v7` kann
#   der Eigentümer auf anderen Code umhängen (so im März 2025 bei tj-actions/changed-files),
#   einen SHA nicht. Dependabot (github-actions) hebt SHA und Kommentar gemeinsam.
# - Der Runner fest auf ubuntu-26.04 statt auf ubuntu-latest: Wann das Abbild wechselt, legen
#   wir selbst, nach einem eigenen Lauf. In ci.yml geht der Probelauf über den Handstart oben;
#   ohne `inputs` gilt ubuntu-26.04.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Auf einem Zweig bricht ein neuer Push den laufenden Lauf ab: Wer dreimal nachschiebt, will
# das Ergebnis des letzten Standes. Auf main nicht: Pushen mehrere Sitzungen schneller nach,
# als ein Lauf braucht, bräche jeder den vorigen ab, und main bliebe ungeprüft. Ein Gate, das
# nie fertig wird, ist kein Gate, und "cancelled" liest sich wie "war nichts".
#
# Der Handstart hat eine eigene Gruppe. In der Gruppe von main wartete er hinter dem
# laufenden Lauf, und von wartenden Läufen behält GitHub je Gruppe nur den jüngsten: Ein
# Probelauf verdrängte den wartenden Lauf zu einem Push, oder ein Push den Probelauf.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-probelauf' || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Prüft die Syntax aller Workflows bei jedem Push: release.yml läuft nur an einem v-Tag, ein
  # Tippfehler darin fiele sonst erst dort auf.
  actionlint:
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  build-and-test:
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # Aktiviert die DB-Integrationstests (alle *_pg_test.go). Ohne diese
      # Variable überspringen sie sich selbst — dann prüfte CI die DB-Invarianten nicht.
      # Der Name MUSS "test" enthalten: die Tests verwerfen das Schema (Notbremse in
      # pruefeTestDatenbank).
      # Ohne Passwort — siehe POSTGRES_HOST_AUTH_METHOD unten.
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/bibliothek_test?sslmode=disable

    # Postgres 18 wie im Betrieb (docker-compose.yml). Die Constraint-Tests prüfen echtes
    # Postgres-Verhalten (z. B. dass ein CHECK nur bei FALSE greift, nicht bei NULL) — das
    # lässt sich mit pgxmock prinzipiell nicht nachbilden.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # trust statt eines Wegwerf-Passworts: Der Container existiert nur für die
          # Dauer dieses Jobs, ist ausschliesslich über localhost des Runners
          # erreichbar und enthält nur Testdaten. Ein Passwort hier wäre kein
          # Sicherheitsgewinn, sondern nur ein Credential im Repository — und als
          # solches nicht von einem echten zu unterscheiden (SonarQube secrets:S6698).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: bibliothek_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out repository code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'

    - name: Verify dependencies
      run: go mod verify

    # Formatierung auch hier und nicht nur im pre-commit-Hook: Ein Hook greift nur bei dem,
    # der ihn installiert hat, nicht bei einem fremden Pull Request oder nach `--no-verify`.
    - name: Formatierung (gofmt)
      run: |
        set -euo pipefail
        NICHT_FORMATIERT=$(gofmt -l . | grep -v '^frontend/' || true)
        if [ -n "$NICHT_FORMATIERT" ]; then
          echo "::error::Nicht gofmt-formatiert:"; echo "$NICHT_FORMATIERT"
          echo "Reparatur: gofmt -w <datei>"
          exit 1
        fi

    # Action v8 + gepinnte v2-Version: .golangci.yml nutzt das v2-Schema, und
    # goinstall@latest würde über den alten Modulpfad (ohne /v2) v1 installieren,
    # dessen "config verify" das v2-Schema ablehnt. Version = lokaler Stand.
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.14.0
        args: --timeout=5m

    # Erreichbarkeitsanalyse gegen toten Code. Tote Methoden einer Schnittstelle sieht
    # deadcode nicht; die findet tote_tueren_test.go im normalen Testschritt.
    - name: Deadcode-Gate
      run: ./scripts/deadcode_gate.sh

    # pg_dump/psql werden von der Restore-Probe (jobs/backup_drill_pg_test.go)
    # gebraucht: Sie erzeugt ein echtes verschlüsseltes Backup und spielt es in eine
    # frische Datenbank zurück. Fehlen die Werkzeuge, überspringt sich der Test selbst
    # — und ein übersprungener Notfallplan ist schlimmer als gar keiner, weil er wie
    # eine bestandene Probe aussieht. Deshalb hier ausdrücklich installieren und die
    # Version prüfen: pg_dump verweigert die Arbeit an einem NEUEREN Server.
    - name: Install PostgreSQL client (Restore-Probe)
      # Ohne Frist hielte ein stiller Paketspiegel den Job bis zum Abbruch nach sechs
      # Stunden, und so lange sähe er aus wie "läuft noch".
      timeout-minutes: 5
      run: |
        # `command -v` allein reicht nicht: Ein Runner-Abbild kann einen älteren Client
        # mitbringen als den Server (Ubuntu 24.04: pg_dump 16; Ubuntu 26.04 bringt 18 mit),
        # und ein älterer Client verweigert den neueren Server. Deshalb die Hauptversion
        # prüfen und bei Bedarf den Client aus dem PGDG-Repo nachziehen, mit harten
        # Netz-Timeouts statt der apt-Vorgabe, die an einem hängenden Spiegel klebt.
        PG_MAJOR=18   # == Service-Image oben und Produktionsversion (docker-compose.yml)
        client_major() { pg_dump --version 2>/dev/null | grep -oE '[0-9]+' | head -1; }
        if ! command -v pg_dump >/dev/null 2>&1 || [ "$(client_major)" -lt "$PG_MAJOR" ]; then
          APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl --fail --max-time 30 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get "${APT_OPTS[@]}" update -qq
          sudo apt-get "${APT_OPTS[@]}" install -y -qq "postgresql-client-${PG_MAJOR}"
          # Ubuntu legt die Binaries versioniert ab; der Wrapper in /usr/bin zeigt sonst
          # weiter auf den Client des Runner-Abbilds.
          export PATH="/usr/lib/postgresql/${PG_MAJOR}/bin:$PATH"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"
        fi
        [ "$(client_major)" -ge "$PG_MAJOR" ] || { echo "pg_dump zu alt: $(pg_dump --version)"; exit 1; }
        pg_dump --version
        psql --version

    # pipefail ist Pflicht: Ohne ihn ist der Status der Pipeline der von `tee`, und ein
    # fehlgeschlagener Testlauf käme als grüner Schritt durch. GitHubs Vorgabe-Shell für
    # `run:` ist `bash -e` OHNE pipefail; `shell: bash` schaltet ihn ein.
    - name: Run Unit Tests
      shell: bash
      run: go test -v -race ./... 2>&1 | tee /tmp/gotest.log

    # Was hat dieser Lauf nicht ausgeführt? Ein übersprungener Prüfpunkt sieht aus wie ein
    # bestandener. Ob eine Prüfung laufen muss, entscheiden die Guards im Go-Code
    # (db/pgtest_guard_test.go für die DB-Invarianten, jobs/restore_drill_guard_test.go für
    # den Notfallplan); sie stehen neben dem, was sie bewachen.
    #
    # Dieser Schritt bricht deshalb nichts ab. Er schreibt die Bilanz ins Log, damit ein neuer
    # stiller Skip sichtbar wird, für den noch niemand einen Guard geschrieben hat. Legitime
    # Skips gibt es: Die Littera-Läufe brauchen den echten Altbestand (LITTERA_CSV_DIR,
    # leser.csv, verleih.csv …), der nicht im Repo liegt.
    - name: Skip-Bilanz
      shell: bash
      run: |
        echo "── Diese Tests wurden übersprungen ──"
        grep -A 1 -E "^\s*--- SKIP" /tmp/gotest.log || echo "(kein Test übersprungen)"

  frontend-test:
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
    - name: Check out repository code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # cache: npm — npm ci zieht die Tarballs aus dem Runner-Cache statt aus der Registry;
    # das Netz braucht es nur, wenn sich der Lockfile ändert, und eine gestörte Registry hält
    # den Lauf nicht auf.
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # == Dockerfile frontend-builder: getestet wird mit der Node-Major, die das
        # ausgelieferte Bundle baut (docs/umgebung_paritaet_test.go hält das Paar).
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      timeout-minutes: 10
      run: |
        cd frontend
        npm ci

    # ESLint auch hier: Ein Hook greift nur bei dem, der ihn installiert hat; CI ist die
    # Stelle, die für alle gilt.
    - name: Run ESLint
      run: |
        cd frontend
        npm run lint

    # Prettier aus demselben Grund wie gofmt oben.
    # `--check` ändert nichts, es meldet nur; die Reparatur steht in der Meldung.
    - name: Formatierung (Prettier)
      run: |
        cd frontend
        npx prettier --check src/ e2e/ --log-level warn

    # svelte-check auch hier und nicht nur im pre-push-Hook: jsconfig.json setzt checkJs, und
    # ein Typfehler aus einem Pull Request oder nach --no-verify käme sonst nach main, ohne
    # dass etwas rot wird.
    - name: Run svelte-check (Frontend-Typen)
      run: |
        cd frontend
        npm run check

    - name: Run Vitest
      run: |
        cd frontend
        npm run test

  e2e:
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
    - name: Check out repository code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # cache: npm — siehe frontend-test: die Registry wird nur noch bei
    # Lockfile-Änderungen gebraucht.
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # == Dockerfile frontend-builder (siehe frontend-test-Job).
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    # Browser-Binaries (~130 MB CDN-Download) am Lockfile-Stand cachen: Bei
    # unverändertem Playwright ist `playwright install` damit ein No-op und der
    # CDN fällt als Ausfallquelle weg.
    - name: Cache Playwright-Browser
      id: pw-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

    # docker-compose.local.yml referenziert das externe Caddy-Netz des
    # Produktiv-Hosts — auf dem Runner muss es nur existieren.
    # POSTGRES_PASSWORD ist im Compose bewusst Pflicht ohne Default; für den
    # Wegwerf-Stack auf dem Runner reicht ein fester Dummy-Wert.
    - name: Start local stack
      env:
        POSTGRES_PASSWORD: ci-e2e-throwaway-password
      run: |
        docker network create caddy_global_net
        docker compose -f docker-compose.local.yml up -d --build
        for _ in $(seq 1 60); do
          curl -sf http://localhost:8084/health >/dev/null && break
          sleep 2
        done
        curl -sf http://localhost:8084/health

    # Drei Schichten gegen hängende Installationen (apt-Spiegel, Registry, CDN):
    #   1. Cache (oben): npm-Tarballs + Browser-Binaries — das Netz ist im Normalfall
    #      kaum noch beteiligt. `install --with-deps` überspringt den Browser-Download bei
    #      Cache-Treffer und installiert nur die System-Abhängigkeiten via apt.
    #   2. wiederhole: jeder Versuch hart auf 10 min begrenzt (timeout), bis zu drei
    #      Versuche mit Backoff — ein hängender Spiegel kostet einen Versuch, nicht
    #      den Lauf.
    #   3. timeout-minutes als Reißleine, falls doch alles klemmt: roter Schritt zum
    #      Neustarten statt eines endlosen gelben.
    #
    # Nicht nach cache-hit in `install-deps` aufspalten: `install-deps` ruft `apt-get` ohne
    # sudo auf und scheitert an "Unable to lock /var/lib/apt/lists/". Nur `--with-deps`
    # regelt die apt-Rechte selbst. Der Cache greift trotzdem — der Browser-Download entfällt
    # bei Treffer, die apt-Deps sind ohnehin nicht gecacht.
    #
    # Die apt-Sperre hält beim Start des Jobs der apt-daily-Dienst des Runners, und er greift
    # sie während des mehrminütigen apt-Laufs von `--with-deps` erneut; ein Warten vorab hilft
    # dagegen nicht. Mit DPkg::Lock::Timeout wartet apt auf die Sperre, statt zu scheitern,
    # global gesetzt auch in den apt-Aufrufen von Playwright.
    - name: Install Playwright
      timeout-minutes: 15
      run: |
        # Läuft ein Versuch in die Frist, überlebt sein apt-get den Abbruch (es läuft unter
        # sudo) und hält die Sperre der Paketlisten; der nächste Versuch scheiterte daran.
        beende_apt() {
          sudo pkill -x apt-get || true
          for _ in $(seq 1 20); do
            pgrep -x apt-get >/dev/null || break
            sleep 1
          done
          sudo pkill -KILL -x apt-get || true
          sudo dpkg --configure -a || true
        }
        wiederhole() {
          for versuch in 1 2 3; do
            timeout 600 "$@" && return 0
            echo "::warning::Versuch $versuch fehlgeschlagen: $* — neuer Versuch"
            beende_apt
            sleep $((versuch * 10))
          done
          return 1
        }
        # apt wartet bis zu 300 s auf die Sperre, statt an ihr zu scheitern.
        echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/99lock-timeout >/dev/null
        cd frontend
        wiederhole npm ci
        wiederhole npx playwright install --with-deps chromium

    # Kaskaden-Gate für die Druck-Sektionen: Welche der vier versteckten Sektionen des
    # Ausweis-Designers auf dem Papier landet, entscheidet allein die CSS-Kaskade — das ist
    # nur am gebauten CSS in einem echten Browser unter @media print prüfbar. Beides steht in
    # diesem Job ohnehin bereit (Chromium ist installiert, der Build dauert Sekunden), deshalb
    # hängt das Gate hier und nicht an einem eigenen Job. Die Begründung steht im Skript.
    - name: Druck-Sektionen-Gate
      run: |
        cd frontend
        npm run build
        node scripts/druck-sektionen-gate.mjs

    - name: Run E2E tests
      run: |
        cd frontend
        npx playwright test

    - name: Upload traces on failure
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-traces
        path: frontend/test-results/
        retention-days: 7

    - name: Backend logs on failure
      if: failure()
      run: docker logs bibliothek-backend-local --tail 200
