name: Release anlegen (bei v-Tag)

# Tag setzen = Release. Ein Git-Tag `v1.2.3` erzeugt hier automatisch das GitHub-Release
# mit generierten Notes (alle Commits seit dem vorigen Tag); parallel baut
# docker-publish.yml zum selben Tag das versionierte Image ghcr.io/uuuxy/bibliothek:1.2.3
# (plus 1.2 und latest). Ohne diesen Workflow wurde das Release von Hand angelegt und
# wanderte nicht mit: „1.0" zeigte dauerhaft auf einen alten Commit, und weil der Tag
# kein führendes „v" hatte, gab es dazu nicht einmal ein Image.
#
# Ablauf für ein Release (vom Repo-Root, auf grünem main):
#   git tag -a v1.2.3 -m "v1.2.3" && git push origin v1.2.3
#
# Nur Tags im Muster v<major>.<minor>.<patch> — derselbe Filter wie im Docker-Workflow,
# damit Release und Image nie auseinanderlaufen.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: Die generierten Notes brauchen die Historie bis zum vorigen Tag.
      - name: Quellcode auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Ein Tag ist ein Veröffentlichungskanal — bis 22.08.2026 ein ungeschützter: Jeder Push
      # auf irgendeinen Commit (Feature-Branch, roter Stand) erzeugte sofort ein öffentliches
      # Release (Prüfung 22.08.). Drei Wächter: striktes Muster (der Glob oben lässt
      # v1.2.3.4 und vfoo.bar.baz durch), Commit MUSS auf main liegen, CI MUSS dort grün sein.
      - name: Voraussetzungen prüfen (Muster, auf main, CI grün)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' passt nicht auf v<major>.<minor>.<patch> — kein Release."; exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA liegt nicht auf main — Releases kommen nur von main."; exit 1
          fi
          # Check-Runs des getaggten Commits: JEDER Job aus ci.yml muss success sein.
          #
          # Bis zum 07.09.2026 stand hier `name=="build-and-test" or name=="docker-scan"`.
          # Beides zusammen prüfte weniger, als es aussah:
          #   * `docker-scan` gibt es nicht und gab es hier nie — der Name passte auf
          #     keinen einzigen Check-Run. Ein Name, der ins Leere zeigt, verschwindet in
          #     dieser jq-Zeile spurlos: `[…] | all(...)` ist für die leere Menge wahr.
          #   * `e2e` fehlte. Am 06.09. war main vier Stunden lang rot, GENAU in diesem
          #     Job — ein Tag hätte in dieser Zeit ein Release und ein Image erzeugt, und
          #     das Gate hätte grün dazu genickt.
          # Die Liste ist deshalb Pflicht statt Auswahl, und ein FEHLENDER Name ist ein
          # Fehler, kein Freifahrtschein. Sie wird von docs/umgebung_paritaet_test.go
          # gegen die Jobs in ci.yml gehalten — ein neuer CI-Job muss hier mitwachsen.
          PFLICHT="actionlint build-and-test frontend-test e2e"
          RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '.check_runs[] | "\(.name)\t\(.conclusion // "pending")"')
          FEHLT=""; ROT=""
          for job in $PFLICHT; do
            ERGEBNIS=$(printf '%s\n' "$RUNS" | awk -F'\t' -v n="$job" '$1==n {print $2; exit}')
            if [ -z "$ERGEBNIS" ]; then
              FEHLT="$FEHLT $job"
            elif [ "$ERGEBNIS" != "success" ]; then
              ROT="$ROT $job=$ERGEBNIS"
            fi
          done
          if [ -n "$FEHLT" ]; then
            echo "::error::Für $GITHUB_SHA fehlen Prüfungen ganz:$FEHLT. Entweder läuft die CI noch, oder ein Job wurde umbenannt — dann diese Liste in release.yml nachziehen."; exit 1
          fi
          if [ -n "$ROT" ]; then
            echo "::error::CI für $GITHUB_SHA ist nicht grün:$ROT. Erst CI abwarten/grün machen, dann diesen Workflow erneut starten (Re-run)."; exit 1
          fi
          echo "Alle Pflicht-Prüfungen grün:$PFLICHT" 

      # --verify-tag: Kein Release zu einem Tag, der (noch) nicht auf dem Server liegt.
      # Existiert das Release schon (z. B. manueller Vorgriff), wird es NICHT überschrieben —
      # der Schritt meldet das und endet grün, damit ein Wiederholungslauf nichts zerstört.
      - name: GitHub-Release mit generierten Notes anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits — nichts zu tun."
            exit 0
          fi
          # GitHubs --generate-notes listet nur PRs. Hier wird direkt auf main committet —
          # die wichtigsten Änderungen wären sonst unsichtbar. Deshalb zusätzlich die
          # Commit-Betreffzeilen seit dem vorigen v-Tag (ohne Merge-Commits); den
          # PR-Teil hängt GitHub darunter an.
          VORHER=$(git describe --tags --abbrev=0 --match 'v*.*.*' "${TAG}^" 2>/dev/null || true)
          # Ohne vorigen v-Tag (allererstes Release) wäre BEREICH die ganze Historie —
          # dann auf die letzten 100 Commits begrenzen, statt 2.000 Zeilen Notes zu erzeugen.
          if [ -n "$VORHER" ]; then BEREICH="${VORHER}..${TAG}"; DECKEL=""; else BEREICH="$TAG"; DECKEL="--max-count=100"; fi
          {
            echo "Docker-Image: \`ghcr.io/uuuxy/bibliothek:${TAG#v}\` (Build im Workflow 'Docker Image veröffentlichen (ghcr.io)' zum selben Tag)."
            echo
            echo "## Commits${VORHER:+ seit $VORHER}"
            # DECKEL ist leer oder genau ein Argument (--max-count=100)
            # shellcheck disable=SC2086
            git log --no-merges --format='* %s (%h)' $DECKEL "$BEREICH"
            echo
          } > /tmp/notes.md
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            --notes-file /tmp/notes.md
