name: Release anlegen (bei v-Tag)

# Tag setzen = Release. Ein Git-Tag `v1.2.3` erzeugt hier automatisch das GitHub-Release
# mit generierten Notes (alle Commits seit dem vorigen Tag); parallel baut
# docker-publish.yml zum selben Tag das versionierte Image ghcr.io/uuuxy/bibliothek:1.2.3
# (plus 1.2 und latest). Ohne diesen Workflow wurde das Release von Hand angelegt und
# wanderte nicht mit: „1.0" zeigte dauerhaft auf einen alten Commit, und weil der Tag
# kein führendes „v" hatte, gab es dazu nicht einmal ein Image.
#
# Ablauf für ein Release (vom Repo-Root, auf grünem main):
#   git tag -a v1.2.3 -m "v1.2.3" && git push origin v1.2.3
#
# Nur Tags im Muster v<major>.<minor>.<patch> — derselbe Filter wie im Docker-Workflow,
# damit Release und Image nie auseinanderlaufen.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: Die generierten Notes brauchen die Historie bis zum vorigen Tag.
      - name: Quellcode auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # --verify-tag: Kein Release zu einem Tag, der (noch) nicht auf dem Server liegt.
      # Existiert das Release schon (z. B. manueller Vorgriff), wird es NICHT überschrieben —
      # der Schritt meldet das und endet grün, damit ein Wiederholungslauf nichts zerstört.
      - name: GitHub-Release mit generierten Notes anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits — nichts zu tun."
            exit 0
          fi
          # GitHubs --generate-notes listet nur PRs. Hier wird direkt auf main committet —
          # die wichtigsten Änderungen wären sonst unsichtbar. Deshalb zusätzlich die
          # Commit-Betreffzeilen seit dem vorigen v-Tag (ohne Merge-Commits); den
          # PR-Teil hängt GitHub darunter an.
          VORHER=$(git describe --tags --abbrev=0 --match 'v*.*.*' "${TAG}^" 2>/dev/null || true)
          # Ohne vorigen v-Tag (allererstes Release) wäre BEREICH die ganze Historie —
          # dann auf die letzten 100 Commits begrenzen, statt 2.000 Zeilen Notes zu erzeugen.
          if [ -n "$VORHER" ]; then BEREICH="${VORHER}..${TAG}"; DECKEL=""; else BEREICH="$TAG"; DECKEL="--max-count=100"; fi
          {
            echo "Docker-Image: \`ghcr.io/uuuxy/bibliothek:${TAG#v}\` (Build in „Docker Image veröffentlichen (ghcr.io)“ zum selben Tag)."
            echo
            echo "## Commits${VORHER:+ seit $VORHER}"
            # shellcheck disable=SC2086 — DECKEL ist leer oder genau ein Argument
            git log --no-merges --format='* %s (%h)' $DECKEL "$BEREICH"
            echo
          } > /tmp/notes.md
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            --notes-file /tmp/notes.md
