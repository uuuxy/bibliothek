name: Docker Image veröffentlichen (ghcr.io)

# Baut das vollständige Anwendungs-Image (Multi-Stage: Svelte-Frontend + Go-Backend,
# siehe Dockerfile) und veröffentlicht es in der GitHub Container Registry als
# GitHub-Package. So lässt sich der Prod-Deploy aus einem fertig gebauten, versionierten
# Image ziehen, statt auf dem Server neu zu bauen.
#
# Bildname: ghcr.io/uuuxy/bibliothek
#   - Push auf main        → Tag `latest` und `main-<kurz-sha>`
#   - Git-Tag `v1.2.3`     → Tags `1.2.3` und `1.2` — NICHT latest (latest = neuester main;
#                            bis 22.08.2026 schrieb auch der Tag latest, ein Hotfix-Tag auf
#                            altem Stand setzte latest zurück — Prüfung 22.08.)
#   - manuell (Actions-UI) → Tag `latest`
#
# Das Package ist ÖFFENTLICH (anonym per `docker pull` ziehbar — praktisch für den
# Schulserver; das Repo ist ohnehin public, das Image enthält nur Repo-Inhalte, keine .env).
# Wer je Schul-Spezifisches ins Image legt, stellt die Sichtbarkeit vorher um.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Nur der jeweils neueste Lauf je Ref zählt — ältere Builds werden abgebrochen.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Versioniertes Image nur für ein striktes v-Tag auf main (siehe release.yml).
      - name: Tag prüfen (Muster, auf main)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' passt nicht auf v<major>.<minor>.<patch> — kein Image."; exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA liegt nicht auf main — versionierte Images kommen nur von main."; exit 1
          fi

      - name: An der GitHub Container Registry anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels bestimmen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/uuuxy/bibliothek
          # latest=false: Sonst hängt metadata-action bei semver-Tags automatisch latest an.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Prod läuft auf x86-64 (Hetzner). Kein arm64, um die Buildzeit nicht zu
          # verdoppeln — bei Bedarf hier linux/arm64 ergänzen.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Das Dockerfile stempelt GIT_COMMIT ins Image; update.sh vergleicht den Wert
          # nach dem Deploy mit git rev-parse HEAD (läuft der Container aus DIESEM Commit?).
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
