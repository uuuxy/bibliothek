name: Docker Image veröffentlichen (ghcr.io)

# Baut das vollständige Anwendungs-Image (Multi-Stage: Svelte-Frontend + Go-Backend,
# siehe Dockerfile) und veröffentlicht es in der GitHub Container Registry als
# GitHub-Package. So lässt sich der Prod-Deploy aus einem fertig gebauten, versionierten
# Image ziehen, statt auf dem Server neu zu bauen.
#
# Bildname: ghcr.io/uuuxy/bibliothek
#   - Push auf main        → Tag `latest` und `main-<kurz-sha>`
#   - Git-Tag `v1.2.3`     → Tags `1.2.3`, `1.2`, `latest`
#   - manuell (Actions-UI) → Tag `latest`
#
# Das Package ist beim ersten Push PRIVAT. Sichtbarkeit ggf. in
# GitHub → Packages → bibliothek → Package settings umstellen.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Nur der jeweils neueste Lauf je Ref zählt — ältere Builds werden abgebrochen.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: An der GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/uuuxy/bibliothek
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Prod läuft auf x86-64 (Hetzner). Kein arm64, um die Buildzeit nicht zu
          # verdoppeln — bei Bedarf hier linux/arm64 ergänzen.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Das Dockerfile stempelt GIT_COMMIT ins Image; update.sh vergleicht den Wert
          # nach dem Deploy mit git rev-parse HEAD (läuft der Container aus DIESEM Commit?).
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
