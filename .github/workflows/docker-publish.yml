name: Docker Image veröffentlichen (ghcr.io)

# Baut das vollständige Anwendungs-Image (Multi-Stage: Svelte-Frontend + Go-Backend,
# siehe Dockerfile) und veröffentlicht es in der GitHub Container Registry als
# GitHub-Package. So lässt sich der Prod-Deploy aus einem fertig gebauten, versionierten
# Image ziehen, statt auf dem Server neu zu bauen.
#
# Bildname: ghcr.io/uuuxy/bibliothek
#   - Push auf main        → Tag `latest` und `main-<kurz-sha>`
#   - Git-Tag `v1.2.3`     → Tags `1.2.3` und `1.2` — NICHT latest (latest = neuester main;
#                            bis 22.08.2026 schrieb auch der Tag latest, ein Hotfix-Tag auf
#                            altem Stand setzte latest zurück — Prüfung 22.08.)
#   - manuell (Actions-UI) → Tag `latest`
#
# Das Package ist ÖFFENTLICH (anonym per `docker pull` ziehbar — praktisch für den
# Schulserver; das Repo ist ohnehin public, das Image enthält nur Repo-Inhalte, keine .env).
# Wer je Schul-Spezifisches ins Image legt, stellt die Sichtbarkeit vorher um.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Nur der jeweils neueste Lauf je Ref zählt — ältere Builds werden abgebrochen.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Versioniertes Image nur für ein striktes v-Tag auf main (siehe release.yml).
      #
      # Seit dem 17.09.2026 wird zusätzlich die CI abgefragt — dieselbe Pflichtliste wie in
      # release.yml. Vorher prüfte dieser Schritt nur Muster und main: Ein Tag auf rotem
      # Stand erzeugte zwar kein Release, aber sehr wohl ein Image mit einer Versionsnummer.
      # Solange die Produktion selbst baut (update.sh), war das folgenlos; wer je aus dem
      # Image deployt, zöge sich einen Stand, den kein Gate gesehen hat. Ein Image mit
      # Versionsnummer sagt „geprüft" — dann soll es auch stimmen.
      #
      # Die Liste wird von docs/umgebung_paritaet_test.go gegen die Jobs in ci.yml gehalten,
      # genau wie die in release.yml: Ein neuer CI-Job muss hier mitwachsen, und ein Name,
      # den die CI nicht mehr baut, prüft nichts.
      - name: Tag prüfen (Muster, auf main, CI grün)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' passt nicht auf v<major>.<minor>.<patch> — kein Image."; exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA liegt nicht auf main — versionierte Images kommen nur von main."; exit 1
          fi
          PFLICHT="actionlint build-and-test frontend-test e2e"
          RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '.check_runs[] | "\(.name)\t\(.conclusion // "pending")"')
          FEHLT=""; ROT=""
          for job in $PFLICHT; do
            ERGEBNIS=$(printf '%s\n' "$RUNS" | awk -F'\t' -v n="$job" '$1==n {print $2; exit}')
            if [ -z "$ERGEBNIS" ]; then
              FEHLT="$FEHLT $job"
            elif [ "$ERGEBNIS" != "success" ]; then
              ROT="$ROT $job=$ERGEBNIS"
            fi
          done
          if [ -n "$FEHLT" ]; then
            echo "::error::Für $GITHUB_SHA fehlen Prüfungen ganz:$FEHLT. Entweder läuft die CI noch, oder ein Job wurde umbenannt — dann diese Liste hier und in release.yml nachziehen."; exit 1
          fi
          if [ -n "$ROT" ]; then
            echo "::error::CI für $GITHUB_SHA ist nicht grün:$ROT. Erst CI grün machen, dann diesen Workflow erneut starten (Re-run)."; exit 1
          fi
          echo "Alle Pflicht-Prüfungen grün:$PFLICHT"

      - name: An der GitHub Container Registry anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels bestimmen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/uuuxy/bibliothek
          # latest=false: Sonst hängt metadata-action bei semver-Tags automatisch latest an.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Prod läuft auf x86-64 (Hetzner). Kein arm64, um die Buildzeit nicht zu
          # verdoppeln — bei Bedarf hier linux/arm64 ergänzen.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Das Dockerfile stempelt GIT_COMMIT ins Image; update.sh vergleicht den Wert
          # nach dem Deploy mit git rev-parse HEAD (läuft der Container aus DIESEM Commit?).
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
